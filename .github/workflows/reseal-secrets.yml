name: Reseal workload secrets

on:
  workflow_dispatch:
    inputs:
      secret_scope:
        description: Select which environment bundles to reseal
        required: true
        type: choice
        options:
          - all
          - atmo-api-dev
          - atmo-api-prod
          - q-interior-dev
          - q-interior-prod
          - ghcr-dev
          - ghcr-all
          - argocd-repo
        default: all

permissions:
  contents: write
  id-token: write

concurrency:
  group: gitops-secret-manager-access
  cancel-in-progress: false

jobs:
  reseal:
    if: ${{ inputs.secret_scope != 'ghcr-dev' && inputs.secret_scope != 'ghcr-all' && inputs.secret_scope != 'argocd-repo' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SECRET_SCOPE: ${{ inputs.secret_scope }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_BILLING_ACCOUNT_ID: ${{ vars.GCP_BILLING_ACCOUNT_ID }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      SEALED_SECRETS_CERT_CONTENT: ${{ secrets.SEALED_SECRETS_CERT }}
      GITLAB_REGISTRY_USERNAME: ${{ secrets.GITLAB_REGISTRY_USERNAME }}
      GITLAB_REGISTRY_TOKEN: ${{ secrets.GITLAB_REGISTRY_TOKEN }}
      GHCR_READ_USERNAME: ${{ secrets.GHCR_READ_USERNAME }}
      GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
      GRAPHDB_LICENSE_BASE64: ${{ secrets.GRAPHDB_LICENSE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Require a working branch and configured credentials
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          if [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
            echo "::error::Run secret resealing from a dedicated branch so the generated files can be reviewed before merge."
            exit 1
          fi
          : "${GCP_PROJECT_ID:?Set the GCP_PROJECT_ID repository variable}"
          : "${GCP_BILLING_ACCOUNT_ID:?Set the GCP_BILLING_ACCOUNT_ID repository variable}"
          : "${GCP_WIF_PROVIDER:?Set the GCP_WIF_PROVIDER repository variable}"
          : "${GCP_SERVICE_ACCOUNT:?Set the GCP_SERVICE_ACCOUNT repository variable}"
          : "${SEALED_SECRETS_CERT_CONTENT:?Set the SEALED_SECRETS_CERT repository secret}"
          : "${GITLAB_REGISTRY_USERNAME:?Set the GITLAB_REGISTRY_USERNAME repository secret}"
          : "${GITLAB_REGISTRY_TOKEN:?Set the GITLAB_REGISTRY_TOKEN repository secret}"
          if git grep -q 'Managed by ci/seal-ghcr-registry.sh' HEAD -- workloads/*/*/environments/*/sealed-secrets.yaml; then
            : "${GHCR_READ_USERNAME:?Set GHCR_READ_USERNAME before resealing migrated workloads}"
            : "${GHCR_READ_TOKEN:?Set GHCR_READ_TOKEN before resealing migrated workloads}"
          fi
          if [ "$SECRET_SCOPE" = all ]; then
            : "${GRAPHDB_LICENSE_BASE64:?Set GRAPHDB_LICENSE_BASE64 for the full scope}"
          fi

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          install_components: kubectl

      - name: Check billing-account Secret Manager usage and reserve this run
        uses: ./.github/actions/reserve-secret-manager-access
        with:
          reserve: ${{ inputs.secret_scope == 'all' && '6' || '1' }}

      - name: Install sealing tools
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends jq
          version='0.38.1'
          archive="kubeseal-${version}-linux-amd64.tar.gz"
          expected_sha256='71791ebf0c26675927153e7c2a4418ae769db27084931d24dee2ac58a3c76c2d'
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          curl --fail --silent --show-error --location \
            --output "$temp_dir/$archive" \
            "https://github.com/bitnami/sealed-secrets/releases/download/v${version}/${archive}"
          printf '%s  %s\n' "$expected_sha256" "$temp_dir/$archive" | sha256sum -c -
          tar --extract --gzip --file "$temp_dir/$archive" --directory "$temp_dir" kubeseal
          sudo install -m 0755 "$temp_dir/kubeseal" /usr/local/bin/kubeseal

      - name: Fetch and unpack selected Secret Manager bundles
        env:
          SECRET_SCOPE: ${{ inputs.secret_scope }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          bundle_root="$RUNNER_TEMP/secret-bundles"
          response="$RUNNER_TEMP/secret-manager-response.json"
          mkdir -p "$bundle_root"
          access_token="$(gcloud auth print-access-token)"
          fetch_bundle() {
            secret_name="$1"
            destination="$bundle_root/$secret_name"
            archive="$bundle_root/$secret_name.tar.gz"
            mkdir -p "$destination"
            curl --fail --silent --show-error --max-time 30 \
              --header "Authorization: Bearer $access_token" \
              --output "$response" \
              "https://secretmanager.googleapis.com/v1/projects/${GCP_PROJECT_ID}/secrets/${secret_name}/versions/latest:access"
            jq -er '.payload.data' "$response" | base64 --decode > "$archive"
            python3 - "$archive" <<'PY'
          import base64
          import binascii
          import pathlib
          import sys

          archive_path = pathlib.Path(sys.argv[1])
          payload = archive_path.read_bytes()
          prefix = b"GITOPS_TAR_GZ_BASE64_V1\n"
          if payload.startswith(prefix):
              try:
                  payload = base64.b64decode(payload[len(prefix):].strip(), validate=True)
              except binascii.Error as error:
                  raise SystemExit("Secret bundle contains invalid Base64 data") from error
          if not payload.startswith(b"\x1f\x8b"):
              raise SystemExit("Secret bundle payload is not a gzip archive")
          archive_path.write_bytes(payload)
          PY
            python3 - "$archive" "$destination" <<'PY'
          import os
          import pathlib
          import shutil
          import sys
          import tarfile

          archive_path = pathlib.Path(sys.argv[1])
          destination = pathlib.Path(sys.argv[2])
          with tarfile.open(archive_path, mode="r:gz") as bundle:
              members = bundle.getmembers()
              seen = set()
              for member in members:
                  name = member.name
                  if (
                      not member.isfile()
                      or pathlib.PurePosixPath(name).name != name
                      or name in {"", ".", ".."}
                      or ".." in name
                      or name in seen
                  ):
                      raise SystemExit("Secret bundle must contain unique regular files with simple names")
                  seen.add(name)
                  source = bundle.extractfile(member)
                  if source is None:
                      raise SystemExit("Secret bundle contains an unreadable file")
                  target = destination / name
                  with source, target.open("xb") as output:
                      shutil.copyfileobj(source, output)
                  os.chmod(target, 0o600)
          PY
          }
          export GITHUB_ENV
          case "$SECRET_SCOPE" in
            all)
              for secret_name in atmo-api-dev atmo-api-prod neople-api-dev neople-api-prod q-interior-api-dev q-interior-api-prod; do
                fetch_bundle "$secret_name"
              done
              for name in ATMO_API_DEV_DB_ENV ATMO_API_DEV_JWT_ENV ATMO_API_DEV_OAUTH_ENV ATMO_API_DEV_PUBLICDATA_ENV ATMO_API_PROD_DB_ENV ATMO_API_PROD_JWT_ENV ATMO_API_PROD_OAUTH_ENV ATMO_API_PROD_PUBLICDATA_ENV NEOPLE_GAME_ANALYTICS_API_DEV_ENV NEOPLE_GAME_ANALYTICS_API_DEV_DB_ENV NEOPLE_GAME_ANALYTICS_API_PROD_ENV NEOPLE_GAME_ANALYTICS_API_PROD_DB_ENV Q_INTERIOR_API_DEV_ENV Q_INTERIOR_API_PROD_ENV; do
                case "$name" in
                  ATMO_API_DEV_*) secret_name=atmo-api-dev ;;
                  ATMO_API_PROD_*) secret_name=atmo-api-prod ;;
                  NEOPLE_GAME_ANALYTICS_API_DEV_*) secret_name=neople-api-dev ;;
                  NEOPLE_GAME_ANALYTICS_API_PROD_*) secret_name=neople-api-prod ;;
                  Q_INTERIOR_API_DEV_*) secret_name=q-interior-api-dev ;;
                  Q_INTERIOR_API_PROD_*) secret_name=q-interior-api-prod ;;
                esac
                file="$bundle_root/$secret_name/$name"
                if [ -f "$file" ]; then
                  printf '%s=%s\n' "$name" "$file" >> "$GITHUB_ENV"
                elif [ "$name" != NEOPLE_GAME_ANALYTICS_API_DEV_DB_ENV ]; then
                  echo "::error::Bundle $secret_name is missing required file $name"
                  exit 1
                fi
              done
              secure_files="$RUNNER_TEMP/secure-files"
              mkdir -p "$secure_files"
              printf '%s' "$GRAPHDB_LICENSE_BASE64" | base64 --decode > "$secure_files/LIME_GRAPHDB_FREE_v11.3.license"
              chmod 600 "$secure_files/LIME_GRAPHDB_FREE_v11.3.license"
              printf 'SECURE_FILES_DIR=%s\n' "$secure_files" >> "$GITHUB_ENV"
              ;;
            q-interior-dev)
              secret_name=q-interior-api-dev
              fetch_bundle "$secret_name"
              file="$bundle_root/$secret_name/Q_INTERIOR_API_DEV_ENV"
              test -s "$file"
              printf 'Q_INTERIOR_API_DEV_ENV=%s\n' "$file" >> "$GITHUB_ENV"
              ;;
            q-interior-prod)
              secret_name=q-interior-api-prod
              fetch_bundle "$secret_name"
              file="$bundle_root/$secret_name/Q_INTERIOR_API_PROD_ENV"
              test -s "$file"
              printf 'Q_INTERIOR_API_PROD_ENV=%s\n' "$file" >> "$GITHUB_ENV"
              ;;
            atmo-api-dev)
              secret_name=atmo-api-dev
              fetch_bundle "$secret_name"
              for name in ATMO_API_DEV_DB_ENV ATMO_API_DEV_JWT_ENV ATMO_API_DEV_OAUTH_ENV ATMO_API_DEV_PUBLICDATA_ENV; do
                file="$bundle_root/$secret_name/$name"
                if [ ! -s "$file" ]; then
                  echo "::error::Bundle $secret_name is missing required file $name"
                  exit 1
                fi
                printf '%s=%s\n' "$name" "$file" >> "$GITHUB_ENV"
              done
              ;;
            atmo-api-prod)
              secret_name=atmo-api-prod
              fetch_bundle "$secret_name"
              for name in ATMO_API_PROD_DB_ENV ATMO_API_PROD_JWT_ENV ATMO_API_PROD_OAUTH_ENV ATMO_API_PROD_PUBLICDATA_ENV; do
                file="$bundle_root/$secret_name/$name"
                if [ ! -s "$file" ]; then
                  echo "::error::Bundle $secret_name is missing required file $name"
                  exit 1
                fi
                printf '%s=%s\n' "$name" "$file" >> "$GITHUB_ENV"
              done
              ;;
            *)
              echo "::error::Unsupported secret scope"
              exit 1
              ;;
          esac
          printf 'Q_SECRET_SCOPE=%s\n' "$SECRET_SCOPE" >> "$GITHUB_ENV"
          cert_file="$RUNNER_TEMP/sealed-secrets.crt"
          printf '%s\n' "$SEALED_SECRETS_CERT_CONTENT" > "$cert_file"
          chmod 600 "$cert_file"
          printf 'SEALED_SECRETS_CERT=%s\n' "$cert_file" >> "$GITHUB_ENV"

      - name: Generate SealedSecrets and validate manifests
        run: |
          set -eu
          sh ci/seal-secrets.sh
          if [ "$SECRET_SCOPE" = all ] || [ "$SECRET_SCOPE" = q-interior-dev ]; then
            . ci/q-interior-neon-host.sh
            neon_host="$(q_interior_neon_host_from_env "$Q_INTERIOR_API_DEV_ENV")"
            policy='platform/policies/allow-q-interior-api-dev-db-egress.yaml'
            sed -i -E "s/(matchName: ).*/\\1$neon_host/" "$policy"
            grep -Fq "matchName: $neon_host" "$policy"
          fi
          if [ "$SECRET_SCOPE" = all ] || [ "$SECRET_SCOPE" = q-interior-prod ]; then
            . ci/q-interior-neon-host.sh
            neon_host="$(q_interior_neon_host_from_env "$Q_INTERIOR_API_PROD_ENV")"
            policy='platform/policies/allow-q-interior-api-prod-db-egress.yaml'
            sed -i -E "s/(matchName: ).*/\\1$neon_host/" "$policy"
            grep -Fq "matchName: $neon_host" "$policy"
          fi
          if [ -n "$GHCR_READ_USERNAME" ] && [ -n "$GHCR_READ_TOKEN" ]; then
            case "$SECRET_SCOPE" in
              all) sh ci/seal-ghcr-registry.sh all ;;
              q-interior-dev|q-interior-prod|atmo-api-dev|atmo-api-prod) sh ci/seal-ghcr-registry.sh "$SECRET_SCOPE" ;;
            esac
          fi
          find workloads -name kustomization.yaml -exec sh -c '
            for file do
              directory="$(dirname "$file")"
              echo "Rendering $directory"
              kubectl kustomize "$directory" > /dev/null
            done
          ' sh {} +

      - name: Commit generated secrets to this review branch
        run: |
          set -eu
          if [ "$SECRET_SCOPE" = all ]; then
            git add \
              workloads/atmo/api/environments/dev/sealed-secrets.yaml \
              workloads/atmo/api/environments/prod/sealed-secrets.yaml \
              workloads/atmo/web/environments/dev/sealed-secrets.yaml \
              workloads/atmo/web/environments/prod/sealed-secrets.yaml \
              workloads/neople-game-analytics/api/environments/dev/sealed-secrets.yaml \
              workloads/neople-game-analytics/api/environments/prod/sealed-secrets.yaml \
              workloads/neople-game-analytics/web/environments/dev/sealed-secrets.yaml \
              workloads/neople-game-analytics/web/environments/prod/sealed-secrets.yaml \
              workloads/ontology-asal-agent/api/environments/dev/sealed-secrets.yaml \
              workloads/ontology-asal-agent/api/environments/prod/sealed-secrets.yaml \
              workloads/ontology-asal-agent/web/environments/dev/sealed-secrets.yaml \
              workloads/ontology-asal-agent/web/environments/prod/sealed-secrets.yaml \
              workloads/q-interior/api/environments/dev/sealed-secrets.yaml \
              workloads/q-interior/api/environments/prod/sealed-secrets.yaml \
              workloads/q-interior/web/environments/dev/sealed-secrets.yaml \
              workloads/q-interior/web/environments/prod/sealed-secrets.yaml \
              platform/graphdb/sealed-secret.yaml \
              platform/policies/allow-q-interior-api-dev-db-egress.yaml \
              platform/policies/allow-q-interior-api-prod-db-egress.yaml
          else
            case "$SECRET_SCOPE" in
              q-interior-dev|q-interior-prod)
                environment="${SECRET_SCOPE#q-interior-}"
                git add \
                  "workloads/q-interior/api/environments/$environment/sealed-secrets.yaml" \
                  "workloads/q-interior/web/environments/$environment/sealed-secrets.yaml"
                if [ "$SECRET_SCOPE" = q-interior-prod ]; then
                  git add platform/policies/allow-q-interior-api-prod-db-egress.yaml
                else
                  git add platform/policies/allow-q-interior-api-dev-db-egress.yaml
                fi
                ;;
              atmo-api-dev)
                git add workloads/atmo/api/environments/dev/sealed-secrets.yaml
                ;;
              atmo-api-prod)
                git add workloads/atmo/api/environments/prod/sealed-secrets.yaml
                ;;
            esac
          fi
          if git diff --cached --quiet; then
            echo "No SealedSecret changes to commit"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: reseal workload secrets (${SECRET_SCOPE})"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Remove temporary secret files
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/secret-bundles" \
            "$RUNNER_TEMP/secret-manager-response.json" \
            "$RUNNER_TEMP/secure-files" \
            "$RUNNER_TEMP/sealed-secrets.crt"

  reseal-ghcr-registry:
    if: ${{ inputs.secret_scope == 'ghcr-dev' || inputs.secret_scope == 'ghcr-all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: gitops-ghcr-registry-sealing
      cancel-in-progress: false
    env:
      GHCR_READ_USERNAME: ${{ secrets.GHCR_READ_USERNAME }}
      GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
      SEALED_SECRETS_CERT_CONTENT: ${{ secrets.SEALED_SECRETS_CERT }}
      GHCR_SCOPE: ${{ inputs.secret_scope == 'ghcr-all' && 'all' || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Require a working branch and registry credentials
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          if [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
            echo "::error::Run GHCR sealing from a dedicated review branch."
            exit 1
          fi
          : "${GHCR_READ_USERNAME:?Set the GHCR_READ_USERNAME repository secret}"
          : "${GHCR_READ_TOKEN:?Set the GHCR_READ_TOKEN repository secret with read:packages access}"
          : "${SEALED_SECRETS_CERT_CONTENT:?Set the SEALED_SECRETS_CERT repository secret}"

      - uses: azure/setup-kubectl@v4
        with:
          version: v1.31.4

      - name: Install kubeseal
        run: |
          set -eu
          version='0.38.1'
          archive="kubeseal-${version}-linux-amd64.tar.gz"
          expected_sha256='71791ebf0c26675927153e7c2a4418ae769db27084931d24dee2ac58a3c76c2d'
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          curl --fail --silent --show-error --location \
            --output "$temp_dir/$archive" \
            "https://github.com/bitnami/sealed-secrets/releases/download/v${version}/${archive}"
          printf '%s  %s\n' "$expected_sha256" "$temp_dir/$archive" | sha256sum -c -
          tar --extract --gzip --file "$temp_dir/$archive" --directory "$temp_dir" kubeseal
          sudo install -m 0755 "$temp_dir/kubeseal" /usr/local/bin/kubeseal

      - name: Seal GHCR pull credentials without reading Secret Manager
        run: |
          cert_file="$RUNNER_TEMP/sealed-secrets.crt"
          printf '%s\n' "$SEALED_SECRETS_CERT_CONTENT" > "$cert_file"
          chmod 600 "$cert_file"
          export SEALED_SECRETS_CERT="$cert_file"
          sh ci/seal-ghcr-registry.sh "$GHCR_SCOPE"

      - name: Validate rendered workloads
        run: |
          set -eu
          find workloads -name kustomization.yaml -exec sh -c '
            for file do
              directory="$(dirname "$file")"
              kubectl kustomize "$directory" > /dev/null
            done
          ' sh {} +

      - name: Commit generated GHCR SealedSecrets to this review branch
        run: |
          set -eu
          if [ "$GHCR_SCOPE" = all ]; then
            git add workloads/*/*/environments/dev/sealed-secrets.yaml
            git add workloads/*/*/environments/prod/sealed-secrets.yaml
          else
            git add workloads/*/*/environments/dev/sealed-secrets.yaml
          fi
          if git diff --cached --quiet; then
            echo "No GHCR SealedSecret changes to commit"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: seal GHCR pull credentials (${GHCR_SCOPE})"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Remove temporary certificate
        if: always()
        run: rm -f "$RUNNER_TEMP/sealed-secrets.crt"

  reseal-argocd-repository:
    if: ${{ inputs.secret_scope == 'argocd-repo' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLATFORM_GITOPS_TOKEN: ${{ secrets.PLATFORM_GITOPS_TOKEN }}
      SEALED_SECRETS_CERT_CONTENT: ${{ secrets.SEALED_SECRETS_CERT }}
    steps:
      - uses: actions/checkout@v4
      - name: Require a review branch and repository credentials
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          test "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" || { echo '::error::Use a review branch'; exit 1; }
          : "${PLATFORM_GITOPS_TOKEN:?Missing GitOps repository token}"
          : "${SEALED_SECRETS_CERT_CONTENT:?Missing sealing certificate}"
      - name: Verify GitHub repository access
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_GITOPS_TOKEN }}
        run: gh api repos/lime985340/platform-gitops --jq '.full_name'
      - name: Install kubeseal
        run: |
          set -eu
          version='0.38.1'
          archive="kubeseal-${version}-linux-amd64.tar.gz"
          expected_sha256='71791ebf0c26675927153e7c2a4418ae769db27084931d24dee2ac58a3c76c2d'
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/bitnami/sealed-secrets/releases/download/v${version}/${archive}"
          printf '%s  %s\n' "$expected_sha256" "$RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" kubeseal
          sudo install -m 0755 "$RUNNER_TEMP/kubeseal" /usr/local/bin/kubeseal
      - name: Seal Argo repository credentials
        run: |
          set -eu
          umask 077
          printf '%s\n' "$SEALED_SECRETS_CERT_CONTENT" > "$RUNNER_TEMP/sealed-secrets.crt"
          mkdir -p argocd/repositories
          python3 - <<'PY' | kubeseal --cert "$RUNNER_TEMP/sealed-secrets.crt" --format yaml > argocd/repositories/github-platform-gitops.yaml
          import base64, json, os
          values = {'type': 'git', 'url': 'https://github.com/lime985340/platform-gitops.git', 'username': 'x-access-token', 'password': os.environ['PLATFORM_GITOPS_TOKEN']}
          print(json.dumps({'apiVersion': 'v1', 'kind': 'Secret', 'metadata': {'name': 'repo-github-platform-gitops', 'namespace': 'argocd', 'labels': {'argocd.argoproj.io/secret-type': 'repository'}}, 'data': {key: base64.b64encode(value.encode()).decode() for key, value in values.items()}}))
          PY
      - name: Commit encrypted repository credential
        run: |
          set -eu
          git add argocd/repositories/github-platform-gitops.yaml
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: seal Argo GitHub repository credential'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Remove temporary certificate
        if: always()
        run: rm -f "$RUNNER_TEMP/sealed-secrets.crt"
