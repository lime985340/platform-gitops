stages:
  - validate
  - secrets

validate:manifests:
  image: alpine/k8s:1.31.4
  stage: validate
  script:
    - |
      set -eu
      find workloads -name kustomization.yaml -exec sh -c '
        for file do
          directory="$(dirname "$file")"
          echo "Rendering $directory"
          kubectl kustomize "$directory" > /dev/null
        done
      ' sh {} +
    - echo "Validating raw platform manifests"
    - kubectl apply --dry-run=client --validate=false --filename platform --recursive > /dev/null

.sync-secrets:
  image: alpine/k8s:1.31.4
  stage: secrets
  when: manual
  allow_failure: false
  resource_group: cluster-secrets
  script:
    - set -eu
    - test -n "${KUBECONFIG:-}" || (echo "KUBECONFIG must be configured as a GitLab File variable" >&2; exit 1)
    - test -f "$KUBECONFIG" || (echo "KUBECONFIG does not point to a file" >&2; exit 1)
    - kubectl cluster-info
    - sh ci/sync-secrets.sh

sync:workload-secrets:
  extends: .sync-secrets
