spec:
  inputs:
    update_secrets:
      type: boolean
      default: false
      description: Run the manual Sealed Secrets job for a web pipeline on the selected branch.
---

stages:
  - validate
  - secrets

validate:manifests:
  image: alpine/k8s:1.31.4
  stage: validate
  script:
    - |
      set -eu
      find workloads -name kustomization.yaml -exec sh -c '
        for file do
          directory="$(dirname "$file")"
          echo "Rendering $directory"
          kubectl kustomize "$directory" > /dev/null
        done
      ' sh {} +

validate:platform:
  image:
    name: ghcr.io/yannh/kubeconform:v0.7.0-alpine
    entrypoint: [""]
  stage: validate
  script:
    - /kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.31.0 -summary platform argocd bootstrap

validate:secret-contract:
  image: alpine/k8s:1.31.4
  stage: validate
  script:
    - sh ci/test-seal-secrets-contract.sh

seal:workload-secrets:
  image: alpine/k8s:1.31.4
  stage: secrets
  resource_group: gitops-sealed-secrets
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $[[ inputs.update_secrets ]] == true && $CI_COMMIT_BRANCH != ""'
      when: manual
      allow_failure: false
    - when: never
  script:
    - |
      set -eu
      test -n "${CI_COMMIT_BRANCH:-}" || (echo "Secret sealing requires a branch pipeline" >&2; exit 1)
      test "${CI_DEBUG_TRACE:-false}" != "true" || (echo "CI_DEBUG_TRACE must be disabled for secret sealing" >&2; exit 1)
      test -n "${SEALED_SECRETS_CERT:-}" || (echo "SEALED_SECRETS_CERT must be configured as a GitLab File variable" >&2; exit 1)
      test -f "$SEALED_SECRETS_CERT" || (echo "SEALED_SECRETS_CERT does not point to a file" >&2; exit 1)
      test -n "${GITLAB_REGISTRY_USERNAME:-}" || (echo "GITLAB_REGISTRY_USERNAME is required" >&2; exit 1)
      test -n "${GITLAB_REGISTRY_TOKEN:-}" || (echo "GITLAB_REGISTRY_TOKEN is required" >&2; exit 1)
      test -n "${CI_JOB_TOKEN:-}" || (echo "CI_JOB_TOKEN is required for the GitOps repository push" >&2; exit 1)

      apk add --no-cache curl git jq tar
      kubeseal_version='0.38.1'
      kubeseal_archive="kubeseal-${kubeseal_version}-linux-amd64.tar.gz"
      kubeseal_sha256='71791ebf0c26675927153e7c2a4418ae769db27084931d24dee2ac58a3c76c2d'
      kubeseal_tmp_dir="$(mktemp -d)"
      secure_files_dir="$(mktemp -d)"
      cleanup() {
        rm -rf "$kubeseal_tmp_dir" "$secure_files_dir"
        if [ -n "${askpass_file:-}" ]; then
          rm -f "$askpass_file"
        fi
      }
      trap cleanup EXIT INT TERM
      kubeseal_archive_path="$kubeseal_tmp_dir/$kubeseal_archive"
      curl --fail --silent --show-error --location \
        --output "$kubeseal_archive_path" \
        "https://github.com/bitnami/sealed-secrets/releases/download/v${kubeseal_version}/${kubeseal_archive}"
      printf '%s  %s\n' "$kubeseal_sha256" "$kubeseal_archive_path" | sha256sum -c -
      tar --extract --gzip --file "$kubeseal_archive_path" --directory /usr/local/bin kubeseal
      chmod 755 /usr/local/bin/kubeseal

      api_base="${CI_API_V4_URL:-${CI_SERVER_URL}/api/v4}"
      secure_files_api="${api_base}/projects/${CI_PROJECT_ID}/secure_files"
      secure_files_metadata="$secure_files_dir/.metadata.json"
      curl --fail --silent --show-error \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        "$secure_files_api" > "$secure_files_metadata"
      while IFS='|' read -r secure_file_name _namespace _secret_name _secret_key _output; do
        case "$secure_file_name" in
          ''|'#'*) continue ;;
        esac
        secure_file_id="$(jq -r --arg name "$secure_file_name" \
          '[.[] | select(.name == $name) | .id] | if length == 1 then .[0] else empty end' \
          "$secure_files_metadata")"
        if [ -z "$secure_file_id" ]; then
          echo "Secure File was not found or is ambiguous: $secure_file_name" >&2
          exit 1
        fi
        curl --fail --silent --show-error --location \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --output "$secure_files_dir/$secure_file_name" \
          "$secure_files_api/$secure_file_id/download"
      done < ci/secret-files.conf
      rm -f "$secure_files_metadata"
      export SECURE_FILES_DIR="$secure_files_dir"

      sh ci/seal-secrets.sh

      find workloads -name kustomization.yaml -exec sh -c '
        for file do
          directory="$(dirname "$file")"
          echo "Rendering $directory"
          kubectl kustomize "$directory" > /dev/null
        done
      ' sh {} +

      git config user.name "gitlab-ci[bot]"
      git config user.email "gitlab-ci[bot]@users.noreply.gitlab.com"
      git add \
        workloads/atmo/api/environments/dev/sealed-secrets.yaml \
        workloads/atmo/api/environments/prod/sealed-secrets.yaml \
        workloads/atmo/web/environments/dev/sealed-secrets.yaml \
        workloads/atmo/web/environments/prod/sealed-secrets.yaml \
        workloads/neople-game-analytics/api/environments/dev/sealed-secrets.yaml \
        workloads/neople-game-analytics/api/environments/prod/sealed-secrets.yaml \
        workloads/neople-game-analytics/web/environments/dev/sealed-secrets.yaml \
        workloads/neople-game-analytics/web/environments/prod/sealed-secrets.yaml \
        workloads/ontology-asal-agent/api/environments/dev/sealed-secrets.yaml \
        workloads/ontology-asal-agent/api/environments/prod/sealed-secrets.yaml \
        workloads/ontology-asal-agent/api/environments/dev/proxy-sealed-secrets.yaml \
        workloads/ontology-asal-agent/api/environments/prod/proxy-sealed-secrets.yaml \
        workloads/ontology-asal-agent/web/environments/dev/sealed-secrets.yaml \
        workloads/ontology-asal-agent/web/environments/prod/sealed-secrets.yaml \
        workloads/cli-proxy/api/environments/dev/sealed-secrets.yaml \
        workloads/cli-proxy/api/environments/prod/sealed-secrets.yaml \
        platform/graphdb/sealed-secret.yaml

      if git diff --cached --quiet; then
        echo "No SealedSecret changes to commit"
        exit 0
      fi

      git commit -m "chore: update sealed secrets"

      askpass_file="$(mktemp)"
      umask 077
      cat > "$askpass_file" <<'ASKPASS'
      #!/bin/sh
      case "${1-}" in
        *[Uu]sername*) printf '%s\n' 'gitlab-ci-token' ;;
        *[Pp]assword*) test -n "${CI_JOB_TOKEN:-}" && printf '%s\n' "$CI_JOB_TOKEN" ;;
        *) exit 1 ;;
      esac
      ASKPASS
      chmod 700 "$askpass_file"
      export GIT_ASKPASS="$askpass_file"
      export GIT_TERMINAL_PROMPT=0
      export LC_ALL=C
      unset GIT_TRACE GIT_TRACE2 GIT_TRACE_CURL GIT_CURL_VERBOSE
      git -c credential.helper= -c http.followRedirects=false \
        push "https://${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" \
        "HEAD:${CI_COMMIT_BRANCH}"
