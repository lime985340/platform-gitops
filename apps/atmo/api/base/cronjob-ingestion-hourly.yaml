apiVersion: batch/v1
kind: CronJob
metadata:
  name: atmo-ingestion-hourly
  labels:
    app: atmo-api
spec:
  schedule: "10 * * * *"
  timeZone: "Asia/Seoul"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: atmo-api
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: gitlab-regcred
          containers:
            - name: ingestion
              image: registry.gitlab.com/lime985340/atmo-api:latest
              command: ["java", "-jar", "/app/ingestion.jar"]
              env:
                - name: SPRING_PROFILES_ACTIVE
                  value: ingestion
                - name: SPRING_FLYWAY_ENABLED
                  value: "false"
                - name: INGESTION_JOB
                  value: hourly
                - name: SPRING_CONFIG_IMPORT
                  value: "optional:configtree:/etc/secrets/"
                - name: JAVA_TOOL_OPTIONS
                  value: "-Djava.net.preferIPv4Stack=true -Djava.net.preferIPv6Addresses=false"
              volumeMounts:
                - name: app-secrets
                  mountPath: /etc/secrets
                  readOnly: true
          volumes:
            - name: app-secrets
              projected:
                sources:
                  - secret:
                      name: atmo-db-secret
                      items:
                        - key: SPRING_DATASOURCE_URL
                          path: spring/datasource/url
                        - key: SPRING_DATASOURCE_USERNAME
                          path: spring/datasource/username
                        - key: SPRING_DATASOURCE_PASSWORD
                          path: spring/datasource/password
                        - key: SPRING_REDIS_HOST
                          path: spring/redis/host
                        - key: SPRING_REDIS_PORT
                          path: spring/redis/port
                  - secret:
                      name: atmo-publicdata-secret
                      items:
                        - key: PUBLIC_SERVICE_KEY
                          path: app/external/publicdata/service-key
