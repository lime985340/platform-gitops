apiVersion: apps/v1
kind: Deployment
metadata:
  name: atmo-api
  namespace: atmo-api-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atmo-api
  template:
    metadata:
      labels:
        app: atmo-api
    spec:
      containers:
        - name: atmo-api
          image: registry.gitlab.com/lime985340/atmo-api
          ports:
            - containerPort: 8080

          env:
            # configtree를 루트 한 번만 import (B 방식 핵심)
            - name: SPRING_CONFIG_IMPORT
              value: "optional:configtree:/etc/secrets/"

            # IPv4 우선(IPv6 우선 시도로 인한 NoRouteToHost 방지)
            - name: JAVA_TOOL_OPTIONS
              value: "-Djava.net.preferIPv4Stack=true -Djava.net.preferIPv6Addresses=false"

          volumeMounts:
            - name: app-secrets
              mountPath: /etc/secrets
              readOnly: true

      volumes:
        - name: app-secrets
          projected:
            sources:
              # DB
              - secret:
                  name: atmo-db-secret
                  items:
                    - key: SPRING_DATASOURCE_URL
                      path: spring/datasource/url
                    - key: SPRING_DATASOURCE_USERNAME
                      path: spring/datasource/username
                    - key: SPRING_DATASOURCE_PASSWORD
                      path: spring/datasource/password
                    - key: SPRING_REDIS_HOST
                      path: spring/redis/host
                    - key: SPRING_REDIS_PORT
                      path: spring/redis/port

              # JWT
              - secret:
                  name: atmo-jwt-secret
                  items:
                    - key: JWT_ACCESS_SECRET
                      path: app/jwt/access-secret
                    - key: JWT_REFRESH_SECRET
                      path: app/jwt/refresh-secret
                    - key: JWT_ACCESS_TTL_SECONDS
                      path: app/jwt/access-ttl-seconds
                    - key: JWT_REFRESH_TTL_SECONDS
                      path: app/jwt/refresh-ttl-seconds

              # OAuth (Kakao / Google / Naver)
              - secret:
                  name: atmo-oauth-secret
                  items:
                    - key: KAKAO_CLIENT_ID
                      path: app/oauth/providers/kakao/client-id
                    - key: KAKAO_CLIENT_SECRET
                      path: app/oauth/providers/kakao/client-secret
                    - key: KAKAO_REDIRECT_URI
                      path: app/oauth/providers/kakao/redirect-uri

                    - key: GOOGLE_CLIENT_ID
                      path: app/oauth/providers/google/client-id
                    - key: GOOGLE_CLIENT_SECRET
                      path: app/oauth/providers/google/client-secret
                    - key: GOOGLE_REDIRECT_URI
                      path: app/oauth/providers/google/redirect-uri

                    - key: NAVER_CLIENT_ID
                      path: app/oauth/providers/naver/client-id
                    - key: NAVER_CLIENT_SECRET
                      path: app/oauth/providers/naver/client-secret
                    - key: NAVER_REDIRECT_URI
                      path: app/oauth/providers/naver/redirect-uri

              # Public Data (공공데이터 서비스키)
              - secret:
                  name: atmo-publicdata-secret
                  items:
                    - key: PUBLIC_SERVICE_KEY
                      path: app/external/publicdata/service-key
