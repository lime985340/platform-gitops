apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: atmo-api-dev
labels:
- pairs:
    app.kubernetes.io/instance: atmo-api-dev
  includeSelectors: true
  includeTemplates: true
- pairs:
    app.kubernetes.io/name: atmo-api
  includeSelectors: false
  includeTemplates: true
resources:
- externalsecret-db.yaml
- externalsecret-jwt.yaml
- externalsecret-oauth.yaml
- externalsecret-publicdata.yaml
- externalsecret-gitlab-regcred.yaml
- ../common
images:
- name: registry.gitlab.com/lime985340/atmo-api
  newTag: dev-6a12d3c
  newName: registry.gitlab.com/lime985340/atmo-api
configMapGenerator:
- name: ingress-env
  literals:
  - ingressClass=nginx-private
  - host=atmo-dev.lime.dedyn.io
  - tlsSecret=atmo-dev-tls
replacements:
- source:
    kind: ConfigMap
    name: ingress-env
    fieldPath: data.ingressClass
  targets:
  - select:
      kind: Ingress
      name: atmo-api
    fieldPaths:
    - spec.ingressClassName
- source:
    kind: ConfigMap
    name: ingress-env
    fieldPath: data.host
  targets:
  - select:
      kind: Ingress
      name: atmo-api
    fieldPaths:
    - spec.rules.0.host
    - spec.tls.0.hosts.0
- source:
    kind: ConfigMap
    name: ingress-env
    fieldPath: data.tlsSecret
  targets:
  - select:
      kind: Ingress
      name: atmo-api
    fieldPaths:
    - spec.tls.0.secretName
generatorOptions:
  disableNameSuffixHash: true
