apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: atmo-api-dev
labels:
- pairs:
    app.kubernetes.io/instance: atmo-api-dev
  includeSelectors: true
  includeTemplates: true
- pairs:
    app.kubernetes.io/name: atmo-api
  includeSelectors: false
  includeTemplates: true
resources:
- ../common
images:
- name: registry.gitlab.com/lime985340/atmo-api
  newTag: dev-0dcc950
  newName: registry.gitlab.com/lime985340/atmo-api
configMapGenerator:
- name: ingress-env
  literals:
  - ingressClass=nginx-private
  - host=atmo-dev.lime.dedyn.io
  - tlsSecret=atmo-dev-tls
  - dbSecretKey=seed-atmo-db-dev
  - jwtSecretKey=seed-atmo-jwt-dev
  - oauthSecretKey=seed-atmo-oauth-dev
  - publicdataSecretKey=seed-atmo-publicdata-dev
replacements:
- source:
    kind: ConfigMap
    name: ingress-env
    fieldPath: data.ingressClass
  targets:
  - select:
      kind: Ingress
      name: atmo-api
    fieldPaths:
    - spec.ingressClassName
- source:
    kind: ConfigMap
    name: ingress-env
    fieldPath: data.host
  targets:
  - select:
      kind: Ingress
      name: atmo-api
    fieldPaths:
    - spec.rules.0.host
    - spec.tls.0.hosts.0
- source:
    kind: ConfigMap
    name: ingress-env
    fieldPath: data.tlsSecret
  targets:
  - select:
      kind: Ingress
      name: atmo-api
    fieldPaths:
    - spec.tls.0.secretName
- source:
    kind: ConfigMap
    name: ingress-env
    fieldPath: data.dbSecretKey
  targets:
  - select:
      kind: ExternalSecret
      name: atmo-db-secret
    fieldPaths:
    - spec.dataFrom.0.extract.key
- source:
    kind: ConfigMap
    name: ingress-env
    fieldPath: data.jwtSecretKey
  targets:
  - select:
      kind: ExternalSecret
      name: atmo-jwt-secret
    fieldPaths:
    - spec.dataFrom.0.extract.key
- source:
    kind: ConfigMap
    name: ingress-env
    fieldPath: data.oauthSecretKey
  targets:
  - select:
      kind: ExternalSecret
      name: atmo-oauth-secret
    fieldPaths:
    - spec.dataFrom.0.extract.key
- source:
    kind: ConfigMap
    name: ingress-env
    fieldPath: data.publicdataSecretKey
  targets:
  - select:
      kind: ExternalSecret
      name: atmo-publicdata-secret
    fieldPaths:
    - spec.dataFrom.0.extract.key
generatorOptions:
  disableNameSuffixHash: true
