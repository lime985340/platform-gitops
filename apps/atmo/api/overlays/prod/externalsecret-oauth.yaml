apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: atmo-oauth-secret
  namespace: atmo-api-prod
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-secrets
    kind: ClusterSecretStore
  target:
    name: atmo-oauth-secret
    creationPolicy: Owner
    template:
      type: Opaque
  dataFrom:
    - extract:
        key: seed-atmo-oauth-prod
