apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: atmo-api-prod
labels:
- pairs:
    app.kubernetes.io/instance: atmo-api-prod
    app.kubernetes.io/name: atmo-api
  includeSelectors: true
  includeTemplates: true
resources:
- externalsecret-db.yaml
- externalsecret-jwt.yaml
- externalsecret-oauth.yaml
- externalsecret-publicdata.yaml
- externalsecret-gitlab-regcred.yaml
- ../common
- ../../base
patches:
- path: patch-deployment-metrics.yaml
  target:
    kind: Deployment
    name: atmo-api
- path: patch-deployment-imagepullsecret.yaml
  target:
    kind: Deployment
    name: atmo-api
images:
- name: registry.gitlab.com/lime985340/atmo-api
  newTag: v0.0.2
  newName: registry.gitlab.com/lime985340/atmo-api
configMapGenerator:
- name: ingress-env
  literals:
  - ingressClass=nginx-public
  - host=atmo.lime.dedyn.io
  - tlsSecret=atmo-prod-tls
replacements:
- source:
    kind: ConfigMap
    name: ingress-env
    fieldPath: data.ingressClass
  targets:
  - select:
      kind: Ingress
      name: atmo-api
    fieldPaths:
    - spec.ingressClassName
- source:
    kind: ConfigMap
    name: ingress-env
    fieldPath: data.host
  targets:
  - select:
      kind: Ingress
      name: atmo-api
    fieldPaths:
    - spec.rules.0.host
    - spec.tls.0.hosts.0
- source:
    kind: ConfigMap
    name: ingress-env
    fieldPath: data.tlsSecret
  targets:
  - select:
      kind: Ingress
      name: atmo-api
    fieldPaths:
    - spec.tls.0.secretName
generatorOptions:
  disableNameSuffixHash: true
