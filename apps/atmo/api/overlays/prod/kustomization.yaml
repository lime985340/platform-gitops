apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: atmo-api-prod
resources:
  - externalsecret-db.yaml
  - externalsecret-jwt.yaml
  - externalsecret-oauth.yaml
  - externalsecret-publicdata.yaml
  - externalsecret-gitlab-regcred.yaml
  - ../common
  - ../../base
images:
  - name: registry.gitlab.com/lime985340/atmo-api
    newTag: v0.0.1
configMapGenerator:
  - name: ingress-env
    literals:
      - ingressClass=nginx-public
      - host=atmo.lime.dedyn.io
      - tlsSecret=atmo-prod-tls
generatorOptions:
  disableNameSuffixHash: true
