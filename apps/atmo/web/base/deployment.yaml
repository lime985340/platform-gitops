apiVersion: apps/v1
kind: Deployment
metadata:
  name: atmo-web
  namespace: atmo-web-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atmo-web
  template:
    metadata:
      labels:
        app: atmo-web
    spec:
      containers:
        - name: atmo-web
          image: registry.gitlab.com/lime985340/atmo-web
          ports:
            - containerPort: 80
