apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atmo-web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx-private
  rules:
    - host: atmo-domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: atmo-web
                port:
                  number: 80
  tls:
    - hosts:
        - atmo-domain
      secretName: atmo-domain-tls
