apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atmo-web
  namespace: atmo-web-dev
spec:
  ingressClassName: nginx-private
  rules:
    - host: atmo-web.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: atmo-web
                port:
                  number: 80
  tls:
    - hosts:
        - atmo-web.local
      secretName: atmo-web-dev-tls
