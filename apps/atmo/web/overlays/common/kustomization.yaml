apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
patches:
  - path: patch-deployment-imagepullsecret.yaml
    target:
      kind: Deployment
      name: atmo-web
replacements:
  - source:
      kind: ConfigMap
      name: ingress-env
      fieldPath: data.ingressClass
    targets:
      - select:
          kind: Ingress
          name: atmo-web
        fieldPaths:
          - spec.ingressClassName
  - source:
      kind: ConfigMap
      name: ingress-env
      fieldPath: data.host
    targets:
      - select:
          kind: Ingress
          name: atmo-web
        fieldPaths:
          - spec.rules.0.host
          - spec.tls.0.hosts.0
  - source:
      kind: ConfigMap
      name: ingress-env
      fieldPath: data.tlsSecret
    targets:
      - select:
          kind: Ingress
          name: atmo-web
        fieldPaths:
          - spec.tls.0.secretName
