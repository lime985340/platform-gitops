apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: atmo-web-dev
resources:
  - externalsecret-gitlab-regcred.yaml
  - ../common
  - ../../base
images:
  - name: registry.gitlab.com/lime985340/atmo-web
    newTag: dev-e88146d
configMapGenerator:
  - name: ingress-env
    literals:
      - ingressClass=nginx-private
      - host=atmo-dev.lime.dedyn.io
      - tlsSecret=atmo-dev-tls
generatorOptions:
  disableNameSuffixHash: true
