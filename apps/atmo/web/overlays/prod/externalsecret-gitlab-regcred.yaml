apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gitlab-regcred
  namespace: atmo-web-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-secrets
    kind: ClusterSecretStore
  target:
    name: gitlab-regcred
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "registry.gitlab.com": {
                "username": "{{ .username }}",
                "password": "{{ .token }}",
                "auth": "{{ printf \"%s:%s\" .username .token | b64enc }}"
              }
            }
          }
  dataFrom:
    - extract:
        key: seed-gitlab-registry-pull
