apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: atmos-api-prod
resources:
  - externalsecret-db.yaml
  - externalsecret-gitlab-regcred.yaml
  - ../../base
images:
  - name: registry.gitlab.com/lime985340/atmos-api
    newTag: v0.0.0
patches:
  - target:
      kind: Ingress
      name: atmos-api
    patch: |-
      - op: replace
        path: /spec/ingressClassName
        value: nginx-public
      - op: replace
        path: /spec/rules/0/host
        value: atmos.lime.dedyn.io
      - op: replace
        path: /spec/tls/0/hosts/0
        value: atmos.lime.dedyn.io
      - op: replace
        path: /spec/tls/0/secretName
        value: atmos-prod-tls

  - target:
      kind: Deployment
      name: atmos-api
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations
        value:
          prometheus.io/scrape: "true"
          prometheus.io/port: "8080"
          prometheus.io/path: "/metrics"

  - target:
      kind: Deployment
      name: atmos-api
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: gitlab-regcred
