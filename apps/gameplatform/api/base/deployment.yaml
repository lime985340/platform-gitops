apiVersion: apps/v1
kind: Deployment
metadata:
  name: gameplatform-api
spec:
  replicas: 0
  selector:
    matchLabels:
      app: gameplatform-api
  template:
    metadata:
      labels:
        app: gameplatform-api
    spec:
      containers:
        - name: gameplatform-api
          image: registry.gitlab.com/lime985340/gameplatform-app/gameplatform-api
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: gameplatform-db-secret
