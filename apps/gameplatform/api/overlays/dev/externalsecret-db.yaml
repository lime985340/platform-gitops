apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gameplatform-db-secret
  namespace: gameplatform-api-dev
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-secrets
    kind: ClusterSecretStore
  target:
    name: gameplatform-db-secret
    creationPolicy: Owner
    template:
      type: Opaque
  dataFrom:
    - extract:
        key: seed-gameplatform-db-dev
