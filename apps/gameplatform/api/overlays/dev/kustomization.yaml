apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gameplatform-api-dev
resources:
  - externalsecret-db.yaml
  - ../common
  - ../../base
images:
  - name: registry.gitlab.com/lime985340/gameplatform-app/gameplatform-api
    newTag: dev-0000000
configMapGenerator:
  - name: ingress-env
    literals:
      - host=game-dev.lime.dedyn.io
      - tlsSecret=game-dev-tls
generatorOptions:
  disableNameSuffixHash: true
replacements:
  - source:
      kind: ConfigMap
      name: ingress-env
      fieldPath: data.host
    targets:
      - select:
          kind: Ingress
          name: gameplatform-api
        fieldPaths:
          - spec.rules.0.host
          - spec.tls.0.hosts.0
  - source:
      kind: ConfigMap
      name: ingress-env
      fieldPath: data.tlsSecret
    targets:
      - select:
          kind: Ingress
          name: gameplatform-api
        fieldPaths:
          - spec.tls.0.secretName
