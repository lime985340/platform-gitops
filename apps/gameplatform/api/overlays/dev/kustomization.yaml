apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gameplatform-api-dev
resources:
  - namespace.yaml
  - externalsecret-db.yaml
  - ../../base
images:
  - name: registry.gitlab.com/lime985340/gameplatform-app/gameplatform-api
    newTag: dev-0000000
patches:
  - target:
      kind: Ingress
      name: gameplatform-api
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: lime-game-dev.duckdns.org
      - op: replace
        path: /spec/tls/0/hosts/0
        value: lime-game-dev.duckdns.org
      - op: replace
        path: /spec/tls/0/secretName
        value: game-dev-tls
  - target:
      kind: Deployment
      name: gameplatform-api
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations
        value:
          prometheus.io/scrape: "true"
          prometheus.io/port: "8000"
          prometheus.io/path: "/metrics"
