apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gameplatform-api-prod
resources:
  - externalsecret-db.yaml
  - ../common
  - ../../base
images:
  - name: registry.gitlab.com/lime985340/gameplatform-app/gameplatform-api
    newTag: v0.0.0
configMapGenerator:
  - name: ingress-env
    literals:
      - host=game.lime.dedyn.io
      - tlsSecret=game-prod-tls
generatorOptions:
  disableNameSuffixHash: true
