apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mimir-api-dev
resources:
  - externalsecret-db.yaml
  - ../common
  - ../../base
images:
  - name: registry.gitlab.com/lime985340/mimir-app/mimir-api
    newTag: dev-0000000
configMapGenerator:
  - name: ingress-env
    literals:
      - host=mimir-dev.lime.dedyn.io
      - tlsSecret=mimir-dev-tls
generatorOptions:
  disableNameSuffixHash: true
