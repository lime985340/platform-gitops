apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mimir-api-prod
resources:
  - externalsecret-db.yaml
  - ../common
  - ../../base
images:
  - name: registry.gitlab.com/lime985340/mimir-app/mimir-api
    newTag: v0.0.0
configMapGenerator:
  - name: ingress-env
    literals:
      - host=mimir.lime.dedyn.io
      - tlsSecret=mimir-prod-tls
generatorOptions:
  disableNameSuffixHash: true
