apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mimir-api-prod
resources:
  - externalsecret-db.yaml
  - ../common
  - ../../base
images:
  - name: registry.gitlab.com/lime985340/mimir-app/mimir-api
    newTag: v0.0.0
configMapGenerator:
  - name: ingress-env
    literals:
      - host=mimir.lime.dedyn.io
      - tlsSecret=mimir-prod-tls
generatorOptions:
  disableNameSuffixHash: true
replacements:
  - source:
      kind: ConfigMap
      name: ingress-env
      fieldPath: data.host
    targets:
      - select:
          kind: Ingress
          name: mimir-api
        fieldPaths:
          - spec.rules.0.host
          - spec.tls.0.hosts.0
  - source:
      kind: ConfigMap
      name: ingress-env
      fieldPath: data.tlsSecret
    targets:
      - select:
          kind: Ingress
          name: mimir-api
        fieldPaths:
          - spec.tls.0.secretName
