apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mimir-db-secret
  namespace: mimir-api-prod
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: shared-secrets-k3s
    kind: ClusterSecretStore
  target:
    name: mimir-db-secret
    creationPolicy: Owner
    template:
      type: Opaque
  dataFrom:
    - extract:
        key: seed-mimir-db-prod
