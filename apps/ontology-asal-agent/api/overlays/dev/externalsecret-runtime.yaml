apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ontology-asal-agent-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-secrets
    kind: ClusterSecretStore
  target:
    name: ontology-asal-agent-secrets
    creationPolicy: Owner
  data:
    - secretKey: LLM_API_KEY
      remoteRef:
        key: seed-ontology-asal-agent-dev
        property: LLM_API_KEY
    - secretKey: TRIPLESTORE_USERNAME
      remoteRef:
        key: seed-ontology-asal-agent-dev
        property: TRIPLESTORE_USERNAME
    - secretKey: TRIPLESTORE_PASSWORD
      remoteRef:
        key: seed-ontology-asal-agent-dev
        property: TRIPLESTORE_PASSWORD
