apiVersion: batch/v1
kind: Job
metadata:
  name: ontology-asal-agent-publish-ontology
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ontology-asal-agent
        app.kubernetes.io/component: ontology-migration
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: gitlab-regcred
      containers:
        - name: publish-ontology
          image: registry.gitlab.com/lime985340/ontology-asal-agent-api
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              secret_dir=/var/run/triplestore-writer
              until [ -s "$secret_dir/TRIPLESTORE_USERNAME" ] && [ -s "$secret_dir/TRIPLESTORE_PASSWORD" ]; do
                echo "waiting for triplestore writer credentials"
                sleep 5
              done
              export TRIPLESTORE_USERNAME="$(cat "$secret_dir/TRIPLESTORE_USERNAME")"
              export TRIPLESTORE_PASSWORD="$(cat "$secret_dir/TRIPLESTORE_PASSWORD")"
              until python -c "from urllib.request import urlopen; urlopen('http://graphdb.graphdb.svc.cluster.local:7200/protocol', timeout=5).close()"; do
                echo "waiting for GraphDB"
                sleep 5
              done
              python scripts/publish_ontology.py \
                --endpoint "$TRIPLESTORE_UPDATE_URL" \
                --graph "$TRIPLESTORE_ONTOLOGY_GRAPH" \
                --file ontology/domain.ttl \
                --replace
              python scripts/publish_ontology.py \
                --endpoint "$TRIPLESTORE_UPDATE_URL" \
                --graph "$TRIPLESTORE_SHAPES_GRAPH" \
                --file ontology/shapes.ttl \
                --replace
          envFrom:
            - configMapRef:
                name: ontology-asal-agent-config
          volumeMounts:
            - name: triplestore-writer
              mountPath: /var/run/triplestore-writer
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: triplestore-writer
          secret:
            secretName: ontology-asal-agent-triplestore-writer
            optional: true
