apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-argocd-ghcr-creds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://gitlab.com/lime985340/gitops.git
    targetRevision: feature/clean-gitops-layout
    path: platform/system/argocd-ghcr-creds/resources
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
