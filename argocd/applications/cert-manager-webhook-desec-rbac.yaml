apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-rbac-desec-webhook
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '12'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://gitlab.com/lime985340/gitops.git
    targetRevision: main
    path: platform/security/cert-manager-webhook-desec/rbac
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=false
