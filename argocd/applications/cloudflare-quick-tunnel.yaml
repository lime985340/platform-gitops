apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-cloudflare-quick-tunnel
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: platform
  source:
    repoURL: https://gitlab.com/lime985340/gitops.git
    targetRevision: feature/clean-gitops-layout
    path: platform/networking/cloudflare-tunnel/resources
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudflared
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
