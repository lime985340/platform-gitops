apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-ingress-nginx-public
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.11.2
    helm:
      values: |
        fullnameOverride: platform-ingress-nginx-public

        controller:
          replicaCount: 1

          ingressClass: nginx-public
          ingressClassByName: true
          ingressClassResource:
            name: nginx-public
            enabled: true
            default: false
            controllerValue: k8s.io/ingress-nginx-public

          electionID: platform-ingress-nginx-public-leader

          service:
            type: LoadBalancer
            externalTrafficPolicy: Local
            loadBalancerIP: 192.168.226.110
            annotations:
              metallb.universe.tf/address-pool: public-pool
            ports:
              http: 80
              https: 443
            nodePorts:
              http: 30080
              https: 30443

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"

        defaultBackend:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
