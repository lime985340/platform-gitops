apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: platform
  source:
    chart: loki
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 6.21.0
    helm:
      values: |
        deploymentMode: SingleBinary

        resultsCache:
          enabled: false
        chunksCache:
          enabled: false
        memcachedExporter:
          enabled: false

        loki:
          auth_enabled: false
          schemaConfig:
            configs:
              - from: "2025-01-01" 
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: index_
                  period: 24h
          
          commonConfig:
            replication_factor: 1
          
          storage:
            type: filesystem

        singleBinary:
          replicas: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          persistence:
            enabled: true
            size: 10Gi

        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0
        gateway:
          enabled: false
        loki-canary:
          enabled: false
        test:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
