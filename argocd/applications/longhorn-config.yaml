apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-longhorn-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  source:
    repoURL: https://gitlab.com/lime985340/gitops.git
    targetRevision: feature/clean-gitops-layout
    path: platform/storage/longhorn-config/resources
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
