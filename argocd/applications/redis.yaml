apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  source:
    repoURL: registry-1.docker.io/bitnamicharts
    chart: redis
    targetRevision: 28.0.2
    helm:
      releaseName: redis
      values: |
        fullnameOverride: redis

        architecture: standalone

        auth:
          enabled: false

        sentinel:
          enabled: false

        metrics:
          enabled: false

        commonConfiguration: |-
          appendonly yes
          appendfsync everysec
          save ""
          maxmemory 192mb
          maxmemory-policy allkeys-lru

        master:
          count: 1
          kind: Deployment
          persistence:
            enabled: true
            size: 1Gi
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: redis
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
