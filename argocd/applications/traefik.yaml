apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 41.2.0
    helm:
      releaseName: traefik
      values: |
        deployment:
          replicas: 1

        ingressClass:
          enabled: true
          isDefaultClass: true
          name: traefik

        service:
          enabled: true
          spec:
            type: ClusterIP

        providers:
          kubernetesIngress:
            enabled: true
            publishedService:
              enabled: true
            crossProviderNamespaces:
              - atmo-api-prod
              - atmo-web-prod
              - neople-game-analytics-api-prod
              - neople-game-analytics-web-prod
              - ontology-asal-agent-api-prod
              - ontology-asal-agent-web-prod
          kubernetesCRD:
            enabled: true

        ingressRoute:
          dashboard:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
