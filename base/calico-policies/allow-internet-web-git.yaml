apiVersion: crd.projectcalico.org/v1
kind: GlobalNetworkPolicy
metadata:
  name: gnp-allow-internet-web-git-egress
spec:
  order: 120
  selector: all()
  namespaceSelector: 'kubernetes.io/metadata.name != "kube-system"'
  types:
    - Egress
  egress:
    # HTTP/HTTPS (이미지 pull, API 호출, Git HTTPS, ACME 등)
    - action: Allow
      protocol: TCP
      destination:
        nets:
          - 0.0.0.0/0
        ports: [80, 443]

    # Git SSH (필요 없으면 22 제거)
    - action: Allow
      protocol: TCP
      destination:
        nets:
          - 0.0.0.0/0
        ports: [22]
