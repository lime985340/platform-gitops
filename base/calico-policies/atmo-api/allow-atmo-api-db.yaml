apiVersion: crd.projectcalico.org/v1
kind: GlobalNetworkPolicy
metadata:
  name: gnp-allow-atmo-api-db-egress
spec:
  order: 90
  selector: app == "atmo-api" || app.kubernetes.io/instance == "atmo-api-dev" || app.kubernetes.io/instance == "atmo-api-prod"
  types:
    - Egress
  egress:
    - action: Allow
      protocol: TCP
      destination:
        nets:
          - 0.0.0.0/0
        ports: [5432]
