apiVersion: crd.projectcalico.org/v1
kind: GlobalNetworkPolicy
metadata:
  name: gnp-allow-atmos-api-dev-redis-egress
spec:
  order: 89
  selector: app == "atmos-api"
  namespaceSelector: 'kubernetes.io/metadata.name == "atmos-api-dev"'
  types:
    - Egress
  egress:
    - action: Allow
      protocol: TCP
      destination:
        namespaceSelector: 'kubernetes.io/metadata.name == "platform-redis"'
        selector: app.kubernetes.io/instance == "platform-redis"
        ports: [6379]