apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-restrict
  namespace: ingress-nginx
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - ipBlock:
        cidr: 10.42.0.0/16
    - ipBlock:
        cidr: 10.43.0.0/16
