apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap-oci-osaka
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/lime985340/platform-gitops.git
    targetRevision: refs/heads/main
    path: clusters/oci-osaka/argocd
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
