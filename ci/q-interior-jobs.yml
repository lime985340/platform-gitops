validate:q-interior:
  image: alpine/k8s:1.31.4
  stage: validate
  before_script:
    - apk add --no-cache python3 py3-yaml bash
  script:
    - python3 ci/validate-q-interior.py
    - sh ci/test-q-interior-source.sh
    - sh ci/test-q-interior-neon-host.sh
    - bash -n ci/q-interior-source.sh ci/q-interior-deploy.sh ci/q-interior-neon-host.sh ci/seal-secrets.sh

q:deploy:
  image: alpine:3.20
  stage: distribute
  resource_group: q-interior-gitops-update
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline" && ($Q_ACTION == "deploy-api" || $Q_ACTION == "deploy-web") && $CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache git
  script:
    - sh ci/q-interior-source.sh
    - sh ci/q-interior-deploy.sh
