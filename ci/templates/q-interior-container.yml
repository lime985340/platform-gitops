stages: [test, image, release, gitops]

variables:
  DOCKER_TLS_CERTDIR: ""
  DOCKER_BUILDKIT: "1"

.q_docker:
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind
      command: ["--tls=false"]
  before_script:
    - until docker info; do sleep 2; done
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

build_images:
  stage: image
  extends: .q_docker
  needs: [verify]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - docker build -f docker/Dockerfile -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"

promote_release:
  stage: release
  image: docker:27.5.1-cli
  needs: [verify]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      set -eu
      source_digest="$(docker buildx imagetools inspect "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" | awk '$1 == "Digest:" {print $2; exit}')"
      test -n "$source_digest"
      docker buildx imagetools create --prefer-index=false --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
      release_digest="$(docker buildx imagetools inspect "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" | awk '$1 == "Digest:" {print $2; exit}')"
      test "$source_digest" = "$release_digest"

.q_gitops_trigger:
  stage: gitops
  trigger:
    project: lime985340/platform-gitops
    branch: main
    strategy: depend
    forward:
      yaml_variables: true
      pipeline_variables: false

update_gitops_dev:
  extends: .q_gitops_trigger
  inherit:
    variables: [Q_GITOPS_ACTION]
  variables:
    Q_ACTION: "$Q_GITOPS_ACTION"
    Q_SOURCE_REF: "$CI_DEFAULT_BRANCH"
    Q_SOURCE_SHA: "$CI_COMMIT_SHA"
  needs: [build_images]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  trigger:
    inputs:
      q_environment: dev

update_gitops_prod:
  extends: .q_gitops_trigger
  inherit:
    variables: [Q_GITOPS_ACTION]
  variables:
    Q_ACTION: "$Q_GITOPS_ACTION"
    Q_SOURCE_REF: "$CI_COMMIT_TAG"
    Q_SOURCE_SHA: "$CI_COMMIT_SHA"
  needs: [promote_release]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  trigger:
    inputs:
      q_environment: prod
