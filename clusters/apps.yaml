apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: applications
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: https://gitlab.com/lime985340/gitops.git
        revision: main
        directories:
          # apps/<product>/<service>/overlays/<env>
          - path: apps/*/*/overlays/*
          - path: apps/*/*/overlays/common
            exclude: true
  template:
    metadata:
      name: '{{ index .path.segments 1 }}-{{ index .path.segments 2 }}-{{ index .path.segments 4 }}'
    spec:
      project: applications
      source:
        repoURL: https://gitlab.com/lime985340/gitops.git
        targetRevision: main
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ index .path.segments 1 }}-{{ index .path.segments 2 }}-{{ index .path.segments 4 }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
  templatePatch: |
    {{- $product := index .path.segments 1 -}}
    {{- $service := index .path.segments 2 -}}
    {{- $env := index .path.segments 4 -}}

    # {{- if and (eq $product "gameplatform") (eq $service "api") }}
    # metadata:
    #   annotations:
    #     argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/argocd-image-updater-git
    #     argocd-image-updater.argoproj.io/write-back-target: kustomization
    #     argocd-image-updater.argoproj.io/image-list: gameplatform-api=registry.gitlab.com/lime985340/gameplatform-app/gameplatform-api
    #     argocd-image-updater.argoproj.io/gameplatform-api.kustomize.image-name: registry.gitlab.com/lime985340/gameplatform-app/gameplatform-api
    #     {{- if eq $env "dev" }}
    #     argocd-image-updater.argoproj.io/gameplatform-api.update-strategy: newest-build
    #     argocd-image-updater.argoproj.io/gameplatform-api.allow-tags: regexp:^dev-[0-9a-f]{7,}$
    #     {{- else if eq $env "prod" }}
    #     argocd-image-updater.argoproj.io/gameplatform-api.update-strategy: semver
    #     argocd-image-updater.argoproj.io/gameplatform-api.allow-tags: regexp:^v[0-9]+\.[0-9]+\.[0-9]+$
    #     {{- end }}
    # {{- end }}

    # {{- if and (eq $product "mimir") (eq $service "api") }}
    # metadata:
    #   annotations:
    #     argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/argocd-image-updater-git
    #     argocd-image-updater.argoproj.io/write-back-target: kustomization
    #     argocd-image-updater.argoproj.io/image-list: mimir-api=registry.gitlab.com/lime985340/mimir-app/mimir-api
    #     argocd-image-updater.argoproj.io/mimir-api.kustomize.image-name: registry.gitlab.com/lime985340/mimir-app/mimir-api
    #     {{- if eq $env "dev" }}
    #     argocd-image-updater.argoproj.io/mimir-api.update-strategy: newest-build
    #     argocd-image-updater.argoproj.io/mimir-api.allow-tags: regexp:^dev-[0-9a-f]{7,}$
    #     {{- else if eq $env "prod" }}
    #     argocd-image-updater.argoproj.io/mimir-api.update-strategy: semver
    #     argocd-image-updater.argoproj.io/mimir-api.allow-tags: regexp:^v[0-9]+\.[0-9]+\.[0-9]+$
    #     {{- end }}
    # {{- end }}

    {{- if and (eq $product "atmo") (eq $service "api") }}
    metadata:
      annotations:
        argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/argocd-image-updater-git
        argocd-image-updater.argoproj.io/write-back-target: kustomization
        argocd-image-updater.argoproj.io/image-list: atmo-api=registry.gitlab.com/lime985340/atmo-api
        argocd-image-updater.argoproj.io/atmo-api.kustomize.image-name: registry.gitlab.com/lime985340/atmo-api
        {{- if eq $env "dev" }}
        argocd-image-updater.argoproj.io/atmo-api.update-strategy: newest-build
        argocd-image-updater.argoproj.io/atmo-api.allow-tags: regexp:^dev-[0-9a-f]{7,}$
        argocd-image-updater.argoproj.io/atmo-api.force-update: "true"
        {{- else if eq $env "prod" }}
        argocd-image-updater.argoproj.io/atmo-api.update-strategy: semver
        argocd-image-updater.argoproj.io/atmo-api.allow-tags: regexp:^v[0-9]+\.[0-9]+\.[0-9]+$
        argocd-image-updater.argoproj.io/atmo-api.force-update: "true"
        {{- end }}
    {{- end }}

    {{- if and (eq $product "atmo") (eq $service "web") }}
    metadata:
      annotations:
        argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/argocd-image-updater-git
        argocd-image-updater.argoproj.io/write-back-target: kustomization
        argocd-image-updater.argoproj.io/image-list: atmo-web=registry.gitlab.com/lime985340/atmo-web
        argocd-image-updater.argoproj.io/atmo-web.kustomize.image-name: registry.gitlab.com/lime985340/atmo-web
        {{- if eq $env "dev" }}
        argocd-image-updater.argoproj.io/atmo-web.update-strategy: newest-build
        argocd-image-updater.argoproj.io/atmo-web.allow-tags: regexp:^dev-[0-9a-f]{7,}$
        argocd-image-updater.argoproj.io/atmo-web.force-update: "true"
        {{- else if eq $env "prod" }}
        argocd-image-updater.argoproj.io/atmo-web.update-strategy: semver
        argocd-image-updater.argoproj.io/atmo-web.allow-tags: regexp:^v[0-9]+\.[0-9]+\.[0-9]+$
        argocd-image-updater.argoproj.io/atmo-web.force-update: "true"
        {{- end }}
    {{- end }}

    {{- if and (eq $product "ontology-asal-agent") (eq $service "api") }}
    metadata:
      annotations:
        argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/argocd-image-updater-git
        argocd-image-updater.argoproj.io/write-back-target: kustomization
        argocd-image-updater.argoproj.io/image-list: ontology-asal-agent-api=registry.gitlab.com/lime985340/ontology-asal-agent-api
        argocd-image-updater.argoproj.io/ontology-asal-agent-api.kustomize.image-name: registry.gitlab.com/lime985340/ontology-asal-agent-api
        {{- if eq $env "dev" }}
        argocd-image-updater.argoproj.io/ontology-asal-agent-api.update-strategy: newest-build
        argocd-image-updater.argoproj.io/ontology-asal-agent-api.allow-tags: regexp:^[0-9a-f]{40}$
        argocd-image-updater.argoproj.io/ontology-asal-agent-api.force-update: "true"
        {{- else if eq $env "prod" }}
        argocd-image-updater.argoproj.io/ontology-asal-agent-api.update-strategy: semver
        argocd-image-updater.argoproj.io/ontology-asal-agent-api.allow-tags: regexp:^v[0-9]+\.[0-9]+\.[0-9]+$
        argocd-image-updater.argoproj.io/ontology-asal-agent-api.force-update: "true"
        {{- end }}
    {{- end }}

    {{- if and (eq $product "ontology-asal-agent") (eq $service "web") }}
    metadata:
      annotations:
        argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/argocd-image-updater-git
        argocd-image-updater.argoproj.io/write-back-target: kustomization
        argocd-image-updater.argoproj.io/image-list: ontology-asal-agent-web=registry.gitlab.com/lime985340/ontology-asal-agent-web
        argocd-image-updater.argoproj.io/ontology-asal-agent-web.kustomize.image-name: registry.gitlab.com/lime985340/ontology-asal-agent-web
        {{- if eq $env "dev" }}
        argocd-image-updater.argoproj.io/ontology-asal-agent-web.update-strategy: newest-build
        argocd-image-updater.argoproj.io/ontology-asal-agent-web.allow-tags: regexp:^[0-9a-f]{40}$
        argocd-image-updater.argoproj.io/ontology-asal-agent-web.force-update: "true"
        {{- else if eq $env "prod" }}
        argocd-image-updater.argoproj.io/ontology-asal-agent-web.update-strategy: semver
        argocd-image-updater.argoproj.io/ontology-asal-agent-web.allow-tags: regexp:^v[0-9]+\.[0-9]+\.[0-9]+$
        argocd-image-updater.argoproj.io/ontology-asal-agent-web.force-update: "true"
        {{- end }}
    {{- end }}
