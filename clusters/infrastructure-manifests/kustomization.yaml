apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Core Infrastructure (Helm Charts)
  - ../../infrastructure/ingress-nginx
  - ../../infrastructure/cert-manager
  - ../../infrastructure/argocd-image-updater

  # Monitoring Stack (Helm Charts)
  - ../../infrastructure/grafana
  - ../../infrastructure/prometheus
  - ../../infrastructure/loki
  - ../../infrastructure/promtail
  - ../../infrastructure/metallb
  - ../../infrastructure/metallb-config

  # Shared Resources
  - ../../infrastructure/redis
  - ../../infrastructure/external-secrets
  - ../../infrastructure/external-secrets-config

  # Base Configurations
  - ../../base/namespaces
