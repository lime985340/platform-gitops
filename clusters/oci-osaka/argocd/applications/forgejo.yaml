apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forgejo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: oci-platform
  sources:
    - repoURL: code.forgejo.org/forgejo-helm
      chart: forgejo
      targetRevision: 17.3.3
      helm:
        releaseName: forgejo
        values: |
          image:
            rootless: true

          containerSecurityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault

          persistence:
            enabled: true
            create: true
            mount: true
            claimName: forgejo-data
            size: 10Gi
            accessModes:
              - ReadWriteOnce
            storageClass: local-path
            annotations:
              helm.sh/resource-policy: keep

          serviceAccount:
            create: true
            name: forgejo
            automountServiceAccountToken: false

          ingress:
            enabled: false

          gitea:
            admin:
              username: forgejo_admin
              email: forgejo@local.domain
              passwordMode: initialOnlyNoReset
            config:
              server:
                DOMAIN: forgejo.tail90ac67.ts.net
                ROOT_URL: https://forgejo.tail90ac67.ts.net/
                DISABLE_SSH: true
                START_SSH_SERVER: false
              service:
                DISABLE_REGISTRATION: true
                REQUIRE_SIGNIN_VIEW: true
              indexer:
                REPO_INDEXER_ENABLED: true
              actions:
                ENABLED: true
                DEFAULT_ACTIONS_URL: https://data.forgejo.org

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi

    - repoURL: https://github.com/lime985340/platform-gitops.git
      targetRevision: refs/heads/main
      path: clusters/oci-osaka/platform/forgejo

  destination:
    server: https://kubernetes.default.svc
    namespace: forgejo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
