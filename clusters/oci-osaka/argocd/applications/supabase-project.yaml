apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: supabase
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: oci-supabase
  source:
    repoURL: https://supabase-community.github.io/supabase-kubernetes
    chart: supabase-project
    targetRevision: 0.8.4
    helm:
      releaseName: supabase
      values: |
        fullnameOverride: supabase

        project:
          publicUrl: http://localhost:8000
          migrations:
            pod:
              spec:
                nodeSelector:
                  kubernetes.io/arch: arm64

        ingress:
          enable: false

        singleDatabase:
          pod:
            spec:
              nodeSelector:
                kubernetes.io/arch: arm64
          storage:
            accessModes:
              - ReadWriteOnce
            storageClassName: local-path
            resources:
              requests:
                storage: 20Gi

        rest:
          pod:
            spec:
              nodeSelector:
                kubernetes.io/arch: arm64

        meta:
          pod:
            spec:
              nodeSelector:
                kubernetes.io/arch: arm64

        realtime:
          pod:
            spec:
              nodeSelector:
                kubernetes.io/arch: arm64

        auth:
          pod:
            spec:
              nodeSelector:
                kubernetes.io/arch: arm64

        supavisor:
          pod:
            spec:
              nodeSelector:
                kubernetes.io/arch: arm64

        edgeRuntime:
          pod:
            spec:
              nodeSelector:
                kubernetes.io/arch: arm64

        envoy:
          pod:
            spec:
              nodeSelector:
                kubernetes.io/arch: arm64

        storage:
          pod:
            spec:
              nodeSelector:
                kubernetes.io/arch: arm64
          storage:
            accessModes:
              - ReadWriteOnce
            storageClassName: local-path
            resources:
              requests:
                storage: 5Gi

        studio:
          pod:
            spec:
              nodeSelector:
                kubernetes.io/arch: arm64
          storage:
            accessModes:
              - ReadWriteOnce
            storageClassName: local-path
            resources:
              requests:
                storage: 1Gi

        analytics:
          enable: false

        vector:
          enable: false
  destination:
    server: https://kubernetes.default.svc
    namespace: supabase
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
