apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: oci-platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: Platform services that are deployed independently in OCI Osaka.
  sourceRepos:
    - https://github.com/lime985340/platform-gitops.git
    - https://maven.ontotext.com/repository/helm-public/
    - code.forgejo.org/forgejo-helm
  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: cloudflared
      server: https://kubernetes.default.svc
    - namespace: graphdb
      server: https://kubernetes.default.svc
    - namespace: forgejo
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
