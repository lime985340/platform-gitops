apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forgejo
  namespace: forgejo
  labels:
    app.kubernetes.io/name: forgejo
    app.kubernetes.io/part-of: platform
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: forgejo-http
      port:
        name: http
  tls:
    - hosts:
        - forgejo
