apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forgejo-tailnet
  namespace: forgejo
  labels:
    app.kubernetes.io/name: forgejo
    app.kubernetes.io/component: internal-ingress
    app.kubernetes.io/part-of: platform
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - forgejo
  rules:
    - host: forgejo
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: forgejo-http
                port:
                  number: 3000
