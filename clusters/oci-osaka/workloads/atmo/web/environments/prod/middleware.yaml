apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: atmo-strip-prefix
spec:
  stripPrefix:
    prefixes:
      - /atmo
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: atmo-canonical-path
spec:
  redirectRegex:
    regex: '^(https?://[^/]+/atmo)/(\?.*)?$'
    replacement: '${1}${2}'
    permanent: true
