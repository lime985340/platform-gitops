apiVersion: apps/v1
kind: Deployment
metadata:
  name: atmo-web
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: atmo-web
  template:
    metadata:
      labels:
        app: atmo-web
        app.kubernetes.io/name: atmo-web
        app.kubernetes.io/component: web
    spec:
      imagePullSecrets:
        - name: ghcr-regcred
      containers:
        - name: atmo-web
          image: ghcr.io/lime985340/atmo-web
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
