apiVersion: apps/v1
kind: Deployment
metadata:
  name: cli-proxy-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cli-proxy-api
  template:
    metadata:
      annotations:
        configmap.reloader.stakater.com/reload: cli-proxy-api-config
      labels:
        app: cli-proxy-api
        app.kubernetes.io/name: cli-proxy-api
        app.kubernetes.io/component: llm-proxy
    spec:
      automountServiceAccountToken: false
      containers:
        - name: cli-proxy-api
          image: eceasy/cli-proxy-api:v7.2.154
          imagePullPolicy: IfNotPresent
          command:
            - ./CLIProxyAPI
          args:
            - --config
            - /etc/cli-proxy-api/config-base.yaml
          ports:
            - name: http
              containerPort: 8317
          volumeMounts:
            - name: config
              mountPath: /etc/cli-proxy-api/config-base.yaml
              subPath: config-base.yaml
              readOnly: true
            - name: auth
              mountPath: /root/.cli-proxy-api
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: cli-proxy-api-config
            items:
              - key: config-base.yaml
                path: config-base.yaml
        - name: auth
          persistentVolumeClaim:
            claimName: cli-proxy-api-auth
