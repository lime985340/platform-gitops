apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: neople-game-analytics-api-dev
labels:
  - pairs:
      app.kubernetes.io/instance: neople-game-analytics-api-dev
    includeSelectors: true
    includeTemplates: true
  - pairs:
      app.kubernetes.io/name: neople-game-analytics-api
    includeSelectors: false
    includeTemplates: true
resources:
  - ../../resources
  - sealed-secrets.yaml
  - database-bootstrap.yaml
patches:
  - target:
      group: batch
      version: v1
      kind: CronJob
    patch: |-
      - op: add
        path: /spec/suspend
        value: true
images:
  - name: ghcr.io/lime985340/neople-game-analytics-api
    newName: ghcr.io/lime985340/neople-game-analytics-api
    newTag: 0526f3da3830e6059c71865d5bfca6946f675fe4
