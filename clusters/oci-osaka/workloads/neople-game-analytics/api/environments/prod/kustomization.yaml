apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: neople-game-analytics-api-prod
labels:
  - pairs:
      app.kubernetes.io/instance: neople-game-analytics-api-prod
    includeSelectors: true
    includeTemplates: true
  - pairs:
      app.kubernetes.io/name: neople-game-analytics-api
    includeSelectors: false
    includeTemplates: true
resources:
  - ../../resources
  - ingress.yaml
  - middleware.yaml
  - sealed-secrets.yaml
patches:
  - target:
      group: batch
      version: v1
      kind: CronJob
    patch: |-
      - op: add
        path: /spec/suspend
        value: false
  - target:
      version: v1
      kind: ConfigMap
      name: neople-game-analytics-api-config
    patch: |-
      - op: replace
        path: /data/DNF_FAME_BAND_COUNT
        value: "8"
      - op: replace
        path: /data/DNF_SAMPLE_LIMIT
        value: "200"
      - op: add
        path: /data/DNF_DETAIL_LIMIT
        value: "100"
      - op: add
        path: /data/CYPHERS_TOP_PLAYER_LIMIT
        value: "100"
      - op: replace
        path: /data/CYPHERS_MATCH_DETAIL_LIMIT
        value: "1000"
images:
  - name: ghcr.io/lime985340/neople-game-analytics-api
    newName: ghcr.io/lime985340/neople-game-analytics-api
    newTag: 772e82c15ab9fecf4fb3b574d7e60129f3a4b53a
