apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: neople-strip-prefix
spec:
  stripPrefix:
    prefixes:
      - /neople
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: neople-canonical-path
spec:
  redirectRegex:
    regex: '^(https?://[^/]+/neople)/(\?.*)?$'
    replacement: '${1}${2}'
    permanent: true
