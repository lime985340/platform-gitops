apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ontology-asal-agent-web-prod
labels:
  - pairs:
      app.kubernetes.io/instance: ontology-asal-agent-web-prod
    includeSelectors: true
    includeTemplates: true
  - pairs:
      app.kubernetes.io/name: ontology-asal-agent
    includeSelectors: false
    includeTemplates: true
resources:
  - ../../resources
  - ingress.yaml
  - redirect-ingress.yaml
  - sealed-secrets.yaml
  - ingress.yaml
  - redirect-ingress.yaml
images:
  - name: ghcr.io/lime985340/ontology-asal-agent-web
    newName: ghcr.io/lime985340/ontology-asal-agent-web
    newTag: oci-prod-v0.1.0
