apiVersion: v1
kind: Service
metadata:
  name: q-interior-clamav
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: clamav
  ports:
    - name: clamd
      port: 3310
      targetPort: clamd
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: q-interior-clamav
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: clamav
  template:
    metadata:
      labels:
        app.kubernetes.io/component: clamav
    spec:
      automountServiceAccountToken: false
      containers:
        - name: clamd
          image: clamav/clamav:1.5.4-debian
          imagePullPolicy: IfNotPresent
          ports:
            - name: clamd
              containerPort: 3310
              protocol: TCP
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          startupProbe:
            tcpSocket:
              port: clamd
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 120
          readinessProbe:
            tcpSocket:
              port: clamd
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
