apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: q-interior-api-prod
labels:
  - pairs:
      app.kubernetes.io/instance: q-interior-api-prod
    includeSelectors: true
    includeTemplates: true
  - pairs:
      app.kubernetes.io/name: q-interior-api
    includeSelectors: false
    includeTemplates: true
resources:
  - ../../resources
  - ingress.yaml
  - middleware.yaml
  - sealed-secrets.yaml
images:
  - name: ghcr.io/lime985340/q-interior-api
    newName: ghcr.io/lime985340/q-interior-api
    newTag: oci-prod-v0.1.0
replicas:
  - name: q-interior-api
    count: 1
