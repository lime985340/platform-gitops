apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: q-interior-web-dev
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: PathPrefix(`/dev/saerom`)
      middlewares:
        - name: q-interior-strip-prefix
      services:
        - name: q-interior-web
          port: 80
