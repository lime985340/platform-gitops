apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: q-interior-web-dev
labels:
  - pairs:
      app.kubernetes.io/instance: q-interior-web-dev
    includeSelectors: true
    includeTemplates: true
  - pairs:
      app.kubernetes.io/name: q-interior-web
    includeSelectors: false
    includeTemplates: true
resources:
  - ../../resources
  - ingress.yaml
  - middleware.yaml
  - sealed-secrets.yaml
images:
  - name: ghcr.io/lime985340/q-interior-client
    newName: ghcr.io/lime985340/q-interior-client
    newTag: 11227e4e2015d3b43ea77d272364ff34ff453b2d
replicas:
  - name: q-interior-web
    count: 1

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: q-interior-web
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: q-interior-web
      spec:
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1
