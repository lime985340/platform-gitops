apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: q-interior-strip-prefix
spec:
  stripPrefix:
    prefixes:
      - /saerom
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: saerom-canonical-path
spec:
  redirectRegex:
    regex: '^https?://([^/]+)/saerom/(\?.*)?$'
    replacement: 'https://${1}/saerom${2}'
    permanent: true
