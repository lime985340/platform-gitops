apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: supabase
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  source:
    repoURL: https://supabase-community.github.io/supabase-kubernetes
    chart: supabase-project
    targetRevision: 0.8.4
    helm:
      releaseName: supabase
      values: |
        fullnameOverride: supabase

        project:
          publicUrl: http://localhost:8000

        ingress:
          enable: false

        singleDatabase:
          storage:
            accessModes:
              - ReadWriteOnce
            storageClassName: standard
            resources:
              requests:
                storage: 20Gi

        storage:
          storage:
            accessModes:
              - ReadWriteOnce
            storageClassName: standard
            resources:
              requests:
                storage: 5Gi

        studio:
          storage:
            accessModes:
              - ReadWriteOnce
            storageClassName: standard
            resources:
              requests:
                storage: 1Gi

        analytics:
          enable: false

        vector:
          enable: false
  destination:
    server: https://kubernetes.default.svc
    namespace: supabase
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
