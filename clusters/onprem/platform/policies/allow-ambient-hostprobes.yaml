apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: ccnp-allow-ambient-hostprobes
spec:
  description: Allow Istio ambient SNAT-ed kubelet health probes.
  enableDefaultDeny:
    egress: false
    ingress: false
  endpointSelector: {}
  ingress:
    - fromCIDR:
        - 169.254.7.127/32
