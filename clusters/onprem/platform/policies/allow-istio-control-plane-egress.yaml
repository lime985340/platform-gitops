apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: ccnp-allow-istio-control-plane-egress
spec:
  description: Allow Istio control-plane pods to reach the Kubernetes API and DNS.
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: istio-system
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: istio-system
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "15008"
              protocol: TCP
