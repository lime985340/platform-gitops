apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: ccnp-allow-istiod-ingress
spec:
  description: Allow ztunnel and node health probes to reach Istiod.
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: istio-system
      k8s:app: istiod
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: istio-system
      toPorts:
        - ports:
            - port: "15010"
              protocol: TCP
            - port: "15012"
              protocol: TCP
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "15014"
              protocol: TCP
