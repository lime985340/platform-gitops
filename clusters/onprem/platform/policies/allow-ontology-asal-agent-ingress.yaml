apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: ccnp-allow-ontology-asal-agent-ingress
spec:
  description: Allow Traefik and Prometheus to reach the ontology agent.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: ontology-asal-agent
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: In
        values:
          - ontology-asal-agent-api-dev
          - ontology-asal-agent-api-prod
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
            k8s:app.kubernetes.io/name: traefik
      toPorts:
        - ports:
            - port: "8765"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8765"
              protocol: TCP
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8765"
              protocol: TCP
