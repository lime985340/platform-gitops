apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: ccnp-allow-traefik-neople-ingress
spec:
  description: Allow Traefik to reach Neople API and Web endpoints.
  endpointSelector:
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: In
        values:
          - neople-game-analytics-api-dev
          - neople-game-analytics-api-prod
          - neople-game-analytics-web-dev
          - neople-game-analytics-web-prod
      - key: k8s:app.kubernetes.io/name
        operator: In
        values:
          - neople-game-analytics-api
          - neople-game-analytics-web
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
            k8s:app.kubernetes.io/name: traefik
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "8080"
              protocol: TCP
