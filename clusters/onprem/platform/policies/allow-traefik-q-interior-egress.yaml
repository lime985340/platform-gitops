apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: ccnp-allow-traefik-q-interior-egress
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: traefik
      k8s:app.kubernetes.io/name: traefik
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: q-interior-api-dev
            k8s:app.kubernetes.io/name: q-interior-api
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: q-interior-api-prod
            k8s:app.kubernetes.io/name: q-interior-api
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: q-interior-web-dev
            k8s:app.kubernetes.io/name: q-interior-web
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: q-interior-web-prod
            k8s:app.kubernetes.io/name: q-interior-web
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
