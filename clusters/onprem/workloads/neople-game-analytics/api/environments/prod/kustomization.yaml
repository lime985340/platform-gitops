apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: neople-game-analytics-api-prod
labels:
  - pairs:
      app.kubernetes.io/instance: neople-game-analytics-api-prod
    includeSelectors: true
    includeTemplates: true
  - pairs:
      app.kubernetes.io/name: neople-game-analytics-api
    includeSelectors: false
    includeTemplates: true
resources:
  - ../../resources
  - ingress.yaml
  - middleware.yaml
  - sealed-secrets.yaml
patches:
  - target:
      group: batch
      version: v1
      kind: CronJob
    patch: |-
      - op: add
        path: /spec/suspend
        value: false
images:
  - name: ghcr.io/lime985340/neople-game-analytics-api
    newName: ghcr.io/lime985340/neople-game-analytics-api
    newTag: b3353703d628da788dd8bdcfbac352afb170fdfc
