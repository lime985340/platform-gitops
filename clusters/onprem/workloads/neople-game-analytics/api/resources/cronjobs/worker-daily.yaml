apiVersion: batch/v1
kind: CronJob
metadata:
  name: neople-game-analytics-worker-realtime
  labels:
    app: neople-game-analytics-api
    app.kubernetes.io/name: neople-game-analytics-worker
    app.kubernetes.io/component: worker
spec:
  schedule: "*/30 * * * *"
  suspend: true
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: neople-game-analytics-api
            app.kubernetes.io/name: neople-game-analytics-worker
            app.kubernetes.io/component: worker
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-regcred
            - name: gitlab-regcred
          containers:
            - name: worker
              image: ghcr.io/lime985340/neople-game-analytics-api
              command: ["python", "-m", "src.pipeline"]
              envFrom:
                - configMapRef:
                    name: neople-game-analytics-api-config
                - secretRef:
                    name: neople-game-analytics-api-secret
                    optional: false
                - secretRef:
                    name: neople-game-analytics-api-db-secret
                    optional: true
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 1
                  memory: 1Gi
              volumeMounts:
                - name: analytics-data
                  mountPath: /app/data
          volumes:
            - name: analytics-data
              persistentVolumeClaim:
                claimName: neople-game-analytics-data
