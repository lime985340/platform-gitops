apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: q-interior-api-dev
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: PathPrefix(`/dev/saerom/api`)
      priority: 100
      middlewares:
        - name: q-interior-strip-prefix
      services:
        - name: q-interior-api
          port: 80
