apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-irreleph4nt-oci-repo-creds
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-secrets
    kind: ClusterSecretStore

  target:
    name: ghcr-irreleph4nt-oci-repo-creds
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      data:
        url: "oci://ghcr.io/irreleph4nt/charts"
        type: "oci"
        username: "{{ .username }}"
        password: "{{ .password }}"

  dataFrom:
    - extract:
        key: seed-ghcr-irreleph4nt-oci
