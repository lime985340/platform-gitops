apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-image-updater
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: infrastructure
  source:
    repoURL: https://gitlab.com/lime985340/gitops.git
    targetRevision: main
    path: infrastructure/argocd-image-updater/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
