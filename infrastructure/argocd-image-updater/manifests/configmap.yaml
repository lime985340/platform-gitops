apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-image-updater-config
  namespace: argocd
data:
  registries.conf: |
    registries:
      - name: gitlab
        api_url: https://registry.gitlab.com
        prefix: registry.gitlab.com
        credentials: secret:argocd/argocd-image-updater-regcred
