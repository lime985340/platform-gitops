apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-image-updater
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argocd-image-updater
  template:
    metadata:
      labels:
        app: argocd-image-updater
    spec:
      serviceAccountName: argocd-image-updater
      containers:
        - name: argocd-image-updater
          image: quay.io/argoprojlabs/argocd-image-updater:v0.15.2
          args:
            - run
            - --loglevel=debug
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 100Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: image-updater-config
              mountPath: /app/config
          env:
            - name: ARGOCD_SERVER
              value: "argocd-server.argocd.svc.cluster.local"
            - name: ARGOCD_INSECURE
              value: "true"
            - name: APPLICATIONS_API
              value: "argocd"
            - name: ARGOCD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: argocd-image-updater-secret
                  key: argocd.token
            - name: GIT_WRITEBACK_ENABLED
              value: "true"
            - name: GIT_WRITEBACK_MODE
              value: "git"
            - name: GIT_WRITEBACK_SECRET
              value: "argocd-image-updater-git"
      volumes:
        - name: image-updater-config
          configMap:
            name: argocd-image-updater-config
