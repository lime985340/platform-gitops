apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-image-updater-git
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: shared-secrets-k3s
    kind: ClusterSecretStore
  target:
    name: argocd-image-updater-git
    creationPolicy: Owner
    template:
      type: Opaque
  dataFrom:
    - extract:
        key: seed-argocd-image-updater-git
