apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  annotations:
    argocd.argoproj.io/sync-wave: "14"
spec:
  acme:
    email: shp8019@gmail.com
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
      - dns01:
          webhook:
            groupName: acme.lime.dedyn.io
            solverName: desec-http
            config:
              apiUrl: https://desec.io/api/v1
              domainName: lime.dedyn.io
              secretName: desec-api-token
              secretKeyName: desec-token
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  annotations:
    argocd.argoproj.io/sync-wave: "14"
spec:
  acme:
    email: shp8019@gmail.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - dns01:
          webhook:
            groupName: acme.lime.dedyn.io
            solverName: desec-http
            config:
              apiUrl: https://desec.io/api/v1
              domainName: lime.dedyn.io
              secretName: desec-api-token
              secretKeyName: desec-token
