apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: desec-api-token
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "12"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-secrets
    kind: ClusterSecretStore
  target:
    name: desec-api-token
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: token
      remoteRef:
        key: seed-desec-api-token
        property: desec-token
