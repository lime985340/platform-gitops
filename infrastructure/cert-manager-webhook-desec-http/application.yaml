apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-webhook-desec-http
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "13"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: cert-manager-webhook-desec-http
    repoURL: oci://ghcr.io/irreleph4nt/charts
    targetRevision: "1.0.1"
    helm:
      values: |
        groupName: acme.lime.dedyn.io
        
        certManager:
          serviceAccountName: cert-manager
          namespace: cert-manager
        
        replicaCount: 1
        
        service:
          type: ClusterIP
          port: 443
        
        secretName:
          - desec-api-token
        
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        
        podSecurityContext:
          enabled: true
          fsGroup: 1001
        
        containerSecurityContext:
          enabled: true
          runAsUser: 1001
          readOnlyRootFilesystem: true
          runAsNonRoot: true
  
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false