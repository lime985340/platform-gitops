---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: desec-webhook
  namespace: cert-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: desec-webhook:flowcontrol-solver
rules:
  - apiGroups:
      - flowcontrol.apiserver.k8s.io
    resources:
      - prioritylevelconfigurations
      - flowschemas
    verbs:
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: desec-webhook:flowcontrol-solver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: desec-webhook:flowcontrol-solver
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: desec-webhook
    namespace: cert-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: desec-webhook:secret-reader
  namespace: cert-manager
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: desec-webhook:secret-reader
  namespace: cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: desec-webhook:secret-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: desec-webhook
    namespace: cert-manager
---
apiVersion: v1
kind: Service
metadata:
  name: desec-webhook
  namespace: cert-manager
spec:
  type: ClusterIP
  ports:
    - port: 443
      targetPort: https
      protocol: TCP
      name: https
  selector:
    app: desec-webhook
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: desec-webhook
  namespace: cert-manager
  labels:
    app: desec-webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: desec-webhook
  template:
    metadata:
      labels:
        app: desec-webhook
    spec:
      serviceAccountName: desec-webhook
      containers:
        - name: desec-webhook
          image: ghcr.io/su541/cert-manager-desec-webhook:latest
          imagePullPolicy: IfNotPresent
          args:
            - --tls-cert-file=/tls/tls.crt
            - --tls-private-key-file=/tls/tls.key
            - --secure-port=8443
          env:
            - name: GROUP_NAME
              value: de.su541.acme
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
          volumeMounts:
            - name: certs
              mountPath: /tls
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: certs
          secret:
            secretName: desec-webhook-certs
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: desec-webhook-selfsign
  namespace: cert-manager
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: desec-webhook-certs
  namespace: cert-manager
spec:
  secretName: desec-webhook-certs
  duration: 43800h # 5년
  issuerRef:
    name: desec-webhook-selfsign
  dnsNames:
    - desec-webhook
    - desec-webhook.cert-manager
    - desec-webhook.cert-manager.svc
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1alpha1.de.su541.acme
  annotations:
    cert-manager.io/inject-ca-from: "cert-manager/desec-webhook-certs"
spec:
  group: de.su541.acme
  groupPriorityMinimum: 1000
  versionPriority: 15
  service:
    name: desec-webhook
    namespace: cert-manager
  version: v1alpha1
