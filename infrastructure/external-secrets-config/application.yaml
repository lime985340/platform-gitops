apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-external-secrets-config
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: infrastructure
  source:
    repoURL: https://gitlab.com/lime985340/gitops.git
    targetRevision: main
    path: infrastructure/external-secrets-config/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
