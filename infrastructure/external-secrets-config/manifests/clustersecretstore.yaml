apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: shared-secrets-k3s
spec:
  conditions:
    - namespaceSelector:
        matchLabels:
          secrets.lime.io/enabled: "true"
  provider:
    kubernetes:
      remoteNamespace: shared-secrets

      server:
        caProvider:
          type: ConfigMap
          namespace: shared-secrets
          name: kube-root-ca.crt
          key: ca.crt

      auth:
        serviceAccount:
          name: eso-shared-secrets-reader
          namespace: shared-secrets
