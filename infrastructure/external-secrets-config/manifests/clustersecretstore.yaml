apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: shared-secrets-k3s
spec:
  # namespaces must opt-in by setting: secrets.lime.io/enabled: "true"
  conditions:
    - namespaces:
        - namespaceSelector:
            matchLabels:
              secrets.lime.io/enabled: "true"

  provider:
    vault:
      # OpenBao is Vault compatible (API + auth). This points to the in-cluster service.
      server: "http://openbao.openbao.svc.cluster.local:8200"

      # KV(v2) mount path. Enable it in OpenBao with: `bao secrets enable -path=kv kv-v2`
      path: "kv"
      version: "v2"

      auth:
        # Create this Secret manually (not stored in Git):
        # kubectl -n external-secrets create secret generic openbao-eso-token --from-literal=token=<TOKEN>
        tokenSecretRef:
          name: openbao-eso-token
          key: token
          namespace: external-secrets
