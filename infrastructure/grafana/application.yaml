apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-grafana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  project: infrastructure
  source:
    chart: grafana
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 9.4.5
    helm:
      values: |
        fullnameOverride: platform-grafana

        ingress:
          enabled: true
          ingressClassName: nginx
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
            nginx.ingress.kubernetes.io/ssl-redirect: "true"
          hosts:
            - grafana-lime.kro.kr
          tls:
            - secretName: grafana-lime-tls
              hosts:
                - grafana-lime.kro.kr

        persistence:
          enabled: false


        sidecar:
          dashboards:
            enabled: true
            label: grafana_dashboard
            labelValue: "1"
            folderAnnotation: grafana_folder
            searchNamespace: monitoring
            provider:
              foldersFromFilesStructure: true
              disableDelete: true
              allowUiUpdates: false

        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Prometheus
                type: prometheus
                access: proxy
                url: http://platform-prometheus-server.monitoring.svc.cluster.local
                isDefault: true
              - name: Loki
                type: loki
                access: proxy
                url: http://platform-loki.monitoring.svc.cluster.local:3100
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
