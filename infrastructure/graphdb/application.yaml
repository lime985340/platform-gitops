apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-graphdb
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: infrastructure
  source:
    repoURL: https://maven.ontotext.com/repository/helm-public/
    chart: graphdb
    targetRevision: 12.5.0
    helm:
      releaseName: graphdb
      values: |
        # One persistent node is the right starting point for the prototype.
        # Move to three nodes only after the data and resource profile justify it.
        replicas: 1

        # GraphDB validates writes against the mounted license. Keep the license
        # in OpenBao and never inline it in this Helm values block.
        license:
          existingSecret: graphdb-license

        configuration:
          externalUrl: http://graphdb.graphdb.svc.cluster.local/

        security:
          enabled: true
          initialUsers:
            existingSecret: graphdb-users
            secretKey: users.js
          provisioner:
            existingSecret: graphdb-users
            tokenKey: GRAPHDB_AUTH_TOKEN

        service:
          enabled: true
          type: ClusterIP

        ingress:
          enabled: false

        persistence:
          enabled: true
          volumeClaimTemplate:
            name: storage
            spec:
              accessModes:
                - ReadWriteOnce
              storageClassName: longhorn-2
              resources:
                requests:
                  storage: 10Gi

        resources:
          requests:
            cpu: 500m
            memory: 4Gi
          limits:
            memory: 4Gi

        podDisruptionBudget:
          enabled: false

        repositories:
          existingConfigmap: graphdb-repositories

        # The chart's repository provisioning hook creates the named repository
        # after GraphDB becomes ready. The ConfigMap key must end in .ttl because
        # the chart mounts each key as a repository config file.
        extraObjects:
          - apiVersion: v1
            kind: ConfigMap
            metadata:
              name: graphdb-repositories
              labels:
                app.kubernetes.io/part-of: ontology-asal-agent
            data:
              asal-agent.ttl: |-
                @prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#>.
                @prefix rep: <http://www.openrdf.org/config/repository#>.
                @prefix sr: <http://www.openrdf.org/config/repository/sail#>.
                @prefix sail: <http://www.openrdf.org/config/sail#>.
                @prefix graphdb: <http://www.ontotext.com/config/graphdb#>.

                [] a rep:Repository ;
                   rep:repositoryID "asal-agent" ;
                   rdfs:label "Ontology ASAL Agent" ;
                   rep:repositoryImpl [
                     rep:repositoryType "graphdb:SailRepository" ;
                     sr:sailImpl [
                       sail:sailType "graphdb:Sail" ;
                       graphdb:base-URL "https://example.org/" ;
                       graphdb:repository-type "file-repository" ;
                       graphdb:ruleset "empty" ;
                       graphdb:storage-folder "storage" ;
                       graphdb:enable-context-index "true" ;
                       graphdb:enablePredicateList "true" ;
                       graphdb:enable-literal-index "true" ;
                       graphdb:in-memory-literal-properties "true"
                     ]
                   ] .

  destination:
    server: https://kubernetes.default.svc
    namespace: graphdb

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
