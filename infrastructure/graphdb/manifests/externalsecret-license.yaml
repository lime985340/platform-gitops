apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: graphdb-license
  namespace: graphdb
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-secrets
    kind: ClusterSecretStore
  target:
    name: graphdb-license
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: graphdb.license
      remoteRef:
        key: seed-ontology-asal-agent-graphdb
        property: graphdb.license
