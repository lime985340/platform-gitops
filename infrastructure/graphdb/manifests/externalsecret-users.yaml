apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: graphdb-users
  namespace: graphdb
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-secrets
    kind: ClusterSecretStore
  target:
    name: graphdb-users
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: users.js
      remoteRef:
        key: seed-ontology-asal-agent-graphdb
        property: users.js
    - secretKey: GRAPHDB_AUTH_TOKEN
      remoteRef:
        key: seed-ontology-asal-agent-graphdb
        property: GRAPHDB_AUTH_TOKEN
