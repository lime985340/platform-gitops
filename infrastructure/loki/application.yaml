apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: infrastructure
  source:
    chart: loki
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 6.21.0
    helm:
      values: |
        deploymentMode: SingleBinary

        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem

        singleBinary:
          replicas: 1
          persistence:
            enabled: true
            size: 10Gi

        read:
          replicas: 0
          persistence:
            enabled: false
        write:
          replicas: 0
          persistence:
            enabled: false
        backend:
          replicas: 0
          persistence:
            enabled: false

        gateway:
          enabled: false

        loki-canary:
          enabled: false
          
        test:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring