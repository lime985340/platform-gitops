apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: public-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.226.110-192.168.226.120
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: private-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.226.101-192.168.226.109
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: public-adv
  namespace: metallb-system
spec:
  ipAddressPools:
    - public-pool
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: private-adv
  namespace: metallb-system
spec:
  ipAddressPools:
    - private-pool
