apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: public-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.45.246-192.168.45.250
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: private-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.45.251-192.168.45.253
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: public-adv
  namespace: metallb-system
spec:
  ipAddressPools:
    - public-pool
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: private-adv
  namespace: metallb-system
spec:
  ipAddressPools:
    - private-pool
