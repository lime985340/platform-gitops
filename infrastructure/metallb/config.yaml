apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: main-static-ips
  namespace: metallb-system
spec:
  addresses:
  - 192.168.226.100-192.168.226.110
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: l2-adv
  namespace: metallb-system
spec:
  ipAddressPools:
  - main-static-ips