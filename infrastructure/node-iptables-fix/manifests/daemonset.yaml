apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-iptables-fix
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: node-iptables-fix
  template:
    metadata:
      labels:
        app: node-iptables-fix
    spec:
      hostNetwork: true
      hostPID: true
      restartPolicy: Always
      containers:
        - name: iptables
          image: busybox:1.36
          securityContext:
            privileged: true
          command:
            - sh
            - -c
            - |
              echo "[node-iptables-fix] Setting up iptables rules"
              
              # ESTABLISHED/RELATED 연결 허용 (필수)
              iptables -C FORWARD -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT 2>/dev/null || \
              iptables -I FORWARD 1 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
              
              # Pod 네트워크 기본 허용 (NetworkPolicy가 세부 제어)
              iptables -C FORWARD -s 10.42.0.0/16 -j ACCEPT 2>/dev/null || \
              iptables -I FORWARD 2 -s 10.42.0.0/16 -j ACCEPT
              
              iptables -C FORWARD -d 10.42.0.0/16 -j ACCEPT 2>/dev/null || \
              iptables -I FORWARD 3 -d 10.42.0.0/16 -j ACCEPT
              
              echo "[node-iptables-fix] Rules applied successfully"
              iptables -L FORWARD -n -v --line-numbers
              
              sleep infinity