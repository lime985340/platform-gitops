apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: infrastructure
  source:
    repoURL: https://openbao.github.io/openbao-helm
    chart: openbao
    targetRevision: 0.4.0
    helm:
      values: |
        server:
          # Transit token injected via Kubernetes Secret (out-of-band)
          extraSecretEnvironmentVars:
            - envName: VAULT_TOKEN
              secretName: openbao-transit-token
              secretKey: VAULT_TOKEN

          dataStorage:
            enabled: true
            size: 5Gi
            storageClass: longhorn-2
            accessMode: ReadWriteOnce

          ha:
            enabled: true
            replicas: 2

            raft:
              enabled: true

            # Main server config (HCL)
            config: |
              ui = true

              listener "tcp" {
                tls_disable = 1
                address = "[::]:8200"
                cluster_address = "[::]:8201"
              }

              # Raft join stabilization (IMPORTANT when replicas=2 from day-0)
              # Use headless service + pod DNS
              retry_join {
                leader_api_addr = "http://openbao-0.openbao-internal.openbao.svc.cluster.local:8200"
              }

              # Transit auto-unseal
              seal "transit" {
                address = "http://openbao-unsealer.openbao.svc.cluster.local:8200"
                key_name = "autounseal"
                mount_path = "transit/"
                disable_renewal = "false"
              }

        ui:
          enabled: true

        injector:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: openbao

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
