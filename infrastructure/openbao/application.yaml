apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao
  namespace: argocd
  annotations:
    # Main OpenBao (KV v2) - Transit auto-unseal
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: infrastructure
  source:
    repoURL: https://openbao.github.io/openbao-helm
    chart: openbao
    targetRevision: 0.4.0
    helm:
      values: |
        server:
          # Transit auto-unseal token is injected via a Kubernetes Secret created once.
          # Secret: openbao/openbao-transit-token
          # Key: VAULT_TOKEN
          extraSecretEnvironmentVars:
            - envName: VAULT_TOKEN
              secretName: openbao-transit-token
              secretKey: VAULT_TOKEN

          # Longhorn PV
          dataStorage:
            enabled: true
            size: 5Gi
            storageClass: longhorn-2
            accessMode: ReadWriteOnce

          # HA + Raft
          ha:
            enabled: true
            replicas: 2
            raft:
              enabled: true
              setNodeId: true
              config: |
                ui = true

                listener "tcp" {
                  tls_disable = 1
                  address = "[::]:8200"
                  cluster_address = "[::]:8201"
                }

                storage "raft" {
                  path = "/openbao/data"
                }

                service_registration "kubernetes" {}

                # Transit auto-unseal (token comes from VAULT_TOKEN env)
                seal "transit" {
                  address = "http://openbao-unsealer.openbao.svc.cluster.local:8200"
                  key_name = "autounseal"
                  mount_path = "transit/"
                  disable_renewal = "false"
                }

        ui:
          enabled: true

        injector:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: openbao

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
