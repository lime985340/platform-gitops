apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-promtail
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "11"
spec:
  project: infrastructure
  source:
    chart: promtail
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 6.16.6
    helm:
      values: |
        fullnameOverride: platform-promtail

        config:
          clients:
            - url: http://platform-loki:3100/loki/api/v1/push

        tolerations:
          - operator: Exists
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
