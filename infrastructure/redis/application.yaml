apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-redis
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: infrastructure
  source:
    chart: redis
    repoURL: https://charts.bitnami.com/bitnami
    targetRevision: "19.1.4"
    helm:
      values: |
        architecture: standalone

        image:
          registry: docker.io
          repository: redis
          tag: 7.2.5-debian-12-r4

        auth:
          enabled: false

        master:
          persistence:
            enabled: false
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi

        replica:
          replicaCount: 0
          persistence:
            enabled: false

        metrics:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-redis
