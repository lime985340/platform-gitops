apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: platform-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: platform-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/instance: platform-redis
    spec:
      containers:
        - name: redis
          image: redis:7.4.7-bookworm
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
          args:
            - "redis-server"
            - "--bind"
            - "0.0.0.0"
            - "--protected-mode"
            - "no"
            - "--appendonly"
            - "no"
            - "--save"
            - ""
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 5
