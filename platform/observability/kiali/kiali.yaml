apiVersion: kiali.io/v1alpha1
kind: Kiali
metadata:
  name: kiali
  namespace: istio-system
spec:
  auth:
    strategy: token
  deployment:
    cluster_wide_access: true
    view_only_mode: true
    network_policy:
      enabled: false
  server:
    web_root: /kiali
    observability:
      metrics:
        enabled: true
  external_services:
    istio:
      root_namespace: istio-system
    prometheus:
      enabled: true
      url: http://prometheus-server.monitoring.svc.cluster.local
    grafana:
      enabled: true
      internal_url: http://grafana.monitoring.svc.cluster.local
