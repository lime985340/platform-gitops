apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: ccnp-allow-ambient-hbone
spec:
  description: Allow ambient workloads to reach node-local and remote ztunnels over HBONE.
  endpointSelector:
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: In
        values:
          - atmo-api-dev
          - atmo-api-prod
          - atmo-web-dev
          - atmo-web-prod
          - cli-proxy-api-dev
          - cli-proxy-api-prod
          - neople-game-analytics-api-dev
          - neople-game-analytics-api-prod
          - neople-game-analytics-web-dev
          - neople-game-analytics-web-prod
          - ontology-asal-agent-api-dev
          - ontology-asal-agent-api-prod
          - ontology-asal-agent-web-dev
          - ontology-asal-agent-web-prod
          - istio-system
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "15008"
              protocol: TCP
  egress:
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "15008"
              protocol: TCP
