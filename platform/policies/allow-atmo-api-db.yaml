apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: ccnp-allow-atmo-api-db-egress
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: atmo-api
  egress:
    - toCIDR:
        - 0.0.0.0/0
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
