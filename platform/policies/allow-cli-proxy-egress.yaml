apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: ccnp-allow-cli-proxy-egress
spec:
  description: Allow CLIProxyAPI to reach Codex authentication and upstream APIs over HTTPS.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: cli-proxy-api
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
