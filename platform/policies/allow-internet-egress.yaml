apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: ccnp-allow-internet-egress
spec:
  description: Allow only Atmo API and ingestion pods to call external HTTP(S) services.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: atmo-api
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
