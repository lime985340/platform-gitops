apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: ccnp-allow-neople-api-db-egress
spec:
  description: Allow Neople API pods to reach the dedicated Neon PostgreSQL endpoint.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: neople-game-analytics-api
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchName: ep-little-hat-b47pvcs9-pooler.c-6.us-east-2.aws.neon.tech
    - toFQDNs:
        - matchName: ep-little-hat-b47pvcs9-pooler.c-6.us-east-2.aws.neon.tech
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
