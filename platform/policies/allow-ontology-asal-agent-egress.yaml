apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: ccnp-allow-ontology-asal-agent-dev-egress
spec:
  description: Allow the ontology agent to call only its internal CLIProxyAPI and GraphDB services.
  endpointSelector:
    matchLabels:
      k8s:app: ontology-asal-agent-api
      k8s:io.kubernetes.pod.namespace: ontology-asal-agent-api-dev
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cli-proxy-api-dev
            k8s:app.kubernetes.io/name: cli-proxy-api
      toPorts:
        - ports:
            - port: "8317"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: graphdb
            k8s:app.kubernetes.io/name: graphdb
      toPorts:
        - ports:
            - port: "7200"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: ccnp-allow-ontology-asal-agent-dev-migration-egress
spec:
  description: Allow the dev ontology migration job to publish to GraphDB.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/component: ontology-migration
      k8s:io.kubernetes.pod.namespace: ontology-asal-agent-api-dev
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: graphdb
            k8s:app.kubernetes.io/name: graphdb
      toPorts:
        - ports:
            - port: "7200"
              protocol: TCP
---
