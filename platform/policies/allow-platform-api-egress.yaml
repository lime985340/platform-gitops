apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: ccnp-allow-platform-api-egress
spec:
  description: Allow platform controllers to reach only the Kubernetes API server.
  endpointSelector:
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: In
        values:
          - argocd
          - local-path-storage
          - monitoring
          - reloader
          - sealed-secrets
          - supabase-operator
          - traefik
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
