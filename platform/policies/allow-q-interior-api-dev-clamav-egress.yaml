apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: ccnp-allow-q-interior-api-dev-clamav-egress
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: q-interior-api-dev
      k8s:app.kubernetes.io/name: q-interior-api
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: q-interior-api-dev
            k8s:app.kubernetes.io/name: q-interior-clamav
      toPorts:
        - ports:
            - port: "3310"
              protocol: TCP
