apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: ccnp-allow-q-interior-api-dev-db-egress
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: q-interior-api-dev
      k8s:app.kubernetes.io/name: q-interior-api
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchName: q-interior-db.unconfigured.invalid
    - toFQDNs:
        - matchName: q-interior-db.unconfigured.invalid
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
