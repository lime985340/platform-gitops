apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: ccnp-allow-q-interior-api-prod-db-egress
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: q-interior-api-prod
      k8s:app.kubernetes.io/name: q-interior-api
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchName: ep-round-cell-b7dupjiz-pooler.c-13.us-east-1.aws.neon.tech
    - toFQDNs:
        - matchName: ep-round-cell-b7dupjiz-pooler.c-13.us-east-1.aws.neon.tech
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
