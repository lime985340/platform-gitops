apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: ccnp-allow-traefik-atmo-egress
spec:
  description: Allow Traefik to route to Atmo API and Web service endpoints.
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: traefik
      k8s:app.kubernetes.io/name: traefik
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: atmo-api-dev
            k8s:app.kubernetes.io/component: api
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: atmo-api-prod
            k8s:app.kubernetes.io/component: api
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: atmo-web-dev
            k8s:app.kubernetes.io/name: atmo-web
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: atmo-web-prod
            k8s:app.kubernetes.io/name: atmo-web
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
