apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: ccnp-allow-traefik-ontology-asal-agent-egress
spec:
  description: Allow Traefik to route to ontology agent API and Web endpoints.
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: traefik
      k8s:app.kubernetes.io/name: traefik
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ontology-asal-agent-api-dev
            k8s:app.kubernetes.io/name: ontology-asal-agent
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ontology-asal-agent-api-prod
            k8s:app.kubernetes.io/name: ontology-asal-agent
      toPorts:
        - ports:
            - port: "8765"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ontology-asal-agent-web-dev
            k8s:app.kubernetes.io/name: ontology-asal-agent
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ontology-asal-agent-web-prod
            k8s:app.kubernetes.io/name: ontology-asal-agent
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
