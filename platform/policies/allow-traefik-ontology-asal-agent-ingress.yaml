apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: ccnp-allow-traefik-ontology-asal-agent-ingress
spec:
  description: Allow Traefik to reach ontology agent API and Web endpoints.
  endpointSelector:
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: In
        values:
          - ontology-asal-agent-api-dev
          - ontology-asal-agent-api-prod
          - ontology-asal-agent-web-dev
          - ontology-asal-agent-web-prod
      - key: k8s:app.kubernetes.io/name
        operator: In
        values:
          - ontology-asal-agent
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
            k8s:app.kubernetes.io/name: traefik
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "8765"
              protocol: TCP
