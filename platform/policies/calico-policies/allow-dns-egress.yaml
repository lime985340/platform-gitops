apiVersion: crd.projectcalico.org/v1
kind: GlobalNetworkPolicy
metadata:
  name: gnp-allow-dns-egress
spec:
  order: 100
  selector: all()
  namespaceSelector: 'kubernetes.io/metadata.name != "kube-system"'
  types:
    - Egress
  egress:
    # CoreDNS
    - action: Allow
      protocol: UDP
      destination:
        namespaceSelector: 'kubernetes.io/metadata.name == "kube-system"'
        selector: 'k8s-app == "kube-dns" || app.kubernetes.io/name == "coredns"'
        ports: [53]
    - action: Allow
      protocol: TCP
      destination:
        namespaceSelector: 'kubernetes.io/metadata.name == "kube-system"'
        selector: 'k8s-app == "kube-dns" || app.kubernetes.io/name == "coredns"'
        ports: [53]

    # NodeLocal DNSCache (환경에 따라 사용)
    - action: Allow
      protocol: UDP
      destination:
        namespaceSelector: 'kubernetes.io/metadata.name == "kube-system"'
        selector: 'k8s-app == "node-local-dns"'
        ports: [53]
    - action: Allow
      protocol: TCP
      destination:
        namespaceSelector: 'kubernetes.io/metadata.name == "kube-system"'
        selector: 'k8s-app == "node-local-dns"'
        ports: [53]

    # External DNS (for ACME DNS-01 propagation checks etc.)
    - action: Allow
      protocol: UDP
      destination:
        ports: [53]
    - action: Allow
      protocol: TCP
      destination:
        ports: [53]
