apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: ccnp-allow-atmo-api-redis-egress
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: atmo-api
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: platform-redis
            k8s:app.kubernetes.io/instance: platform-redis
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
