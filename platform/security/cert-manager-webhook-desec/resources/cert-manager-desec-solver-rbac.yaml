apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cert-manager:desec-solver
rules:
  - apiGroups:
      - de.su541.acme
    resources:
      - desec
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-manager:desec-solver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cert-manager:desec-solver
subjects:
  - kind: ServiceAccount
    name: platform-cert-manager
    namespace: cert-manager
