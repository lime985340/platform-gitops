apiVersion: v1
kind: Service
metadata:
  name: platform-redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: platform-redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: platform-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
