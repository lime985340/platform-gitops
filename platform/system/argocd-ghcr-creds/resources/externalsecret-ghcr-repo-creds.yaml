apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-repo-creds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-secrets
    kind: ClusterSecretStore

  target:
    name: ghcr-repo-creds
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      data:
        # repo-creds는 url prefix 매칭이라 스킴 포함이 안전함
        url: "https://ghcr.io"
        type: "helm"
        username: "{{ .username }}"
        password: "{{ .password }}"
        enableOCI: "true"

  dataFrom:
    - extract:
        # OpenBao(또는 Store)에 저장된 key 이름은 기존 그대로 유지
        key: seed-ghcr-repo-creds
