apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atmo-api
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: atmo-domain
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: atmo-api
                port:
                  number: 80
  tls:
  - hosts:
      - atmo-domain
    secretName: atmo-domain-tls
