apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - externalsecrets/externalsecret-db.yaml
  - externalsecrets/externalsecret-jwt.yaml
  - externalsecrets/externalsecret-oauth.yaml
  - externalsecrets/externalsecret-publicdata.yaml
  - externalsecrets/externalsecret-gitlab-regcred.yaml
patches:
  - path: patches/patch-deployment-metrics.yaml
    target:
      kind: Deployment
      name: atmo-api
  - path: patches/patch-deployment-imagepullsecret.yaml
    target:
      kind: Deployment
      name: atmo-api
  - path: patches/patch-deployment-rollout-readiness.yaml
    target:
      kind: Deployment
      name: atmo-api
