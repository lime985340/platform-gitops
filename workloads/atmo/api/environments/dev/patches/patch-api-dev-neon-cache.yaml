apiVersion: apps/v1
kind: Deployment
metadata:
  name: atmo-api
spec:
  template:
    spec:
      containers:
        - name: atmo-api
          env:
            - name: SPRING_DATASOURCE_HIKARI_MAX_LIFETIME
              value: "1800000"
            - name: ATMO_CACHE_PUBLIC_FRESH_SECONDS
              value: "21600"
            - name: ATMO_CACHE_PUBLIC_RETAIN_SECONDS
              value: "1209600"
