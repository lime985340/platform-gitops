apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atmo-api-prod
  labels:
    app.kubernetes.io/name: atmo-api
    app.kubernetes.io/component: prod-ingress
    app.kubernetes.io/part-of: atmo
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: atmo-api
                port:
                  number: 80
