apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: atmo-api-prod
labels:
- pairs:
    app.kubernetes.io/instance: atmo-api-prod
  includeSelectors: true
  includeTemplates: true
- pairs:
    app.kubernetes.io/name: atmo-api
  includeSelectors: false
  includeTemplates: true
resources:
- ../../resources
- ingress.yaml
- sealed-secrets.yaml
images:
- name: registry.gitlab.com/lime985340/atmo-api
  newTag: v0.2.4
