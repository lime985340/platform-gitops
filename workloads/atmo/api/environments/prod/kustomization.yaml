apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: atmo-api-prod
labels:
- pairs:
    app.kubernetes.io/instance: atmo-api-prod
  includeSelectors: true
  includeTemplates: true
- pairs:
    app.kubernetes.io/name: atmo-api
  includeSelectors: false
  includeTemplates: true
resources:
- ../../resources
- ingress.yaml
- middleware.yaml
- sealed-secrets.yaml
images:
- name: ghcr.io/lime985340/atmo-api
  newName: ghcr.io/lime985340/atmo-api
  newTag: v0.3.3
