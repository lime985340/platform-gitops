apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: atmo-api-prod
labels:
- pairs:
    app.kubernetes.io/instance: atmo-api-prod
  includeSelectors: true
  includeTemplates: true
- pairs:
    app.kubernetes.io/name: atmo-api
  includeSelectors: false
  includeTemplates: true
resources:
- ../../common
- sealedsecret-db.yaml
- sealedsecret-jwt.yaml
- sealedsecret-oauth.yaml
- sealedsecret-publicdata.yaml
- sealedsecret-gitlab-regcred.yaml
images:
- name: registry.gitlab.com/lime985340/atmo-api
  newTag: v0.2.4
  newName: registry.gitlab.com/lime985340/atmo-api
configMapGenerator:
- name: ingress-env
  literals:
  - ingressClass=traefik
  - host=atmo.lime.dedyn.io
  - tlsSecret=atmo-prod-tls
replacements:
- source:
    kind: ConfigMap
    name: ingress-env
    fieldPath: data.ingressClass
  targets:
  - select:
      kind: Ingress
      name: atmo-api
    fieldPaths:
    - spec.ingressClassName
- source:
    kind: ConfigMap
    name: ingress-env
    fieldPath: data.host
  targets:
  - select:
      kind: Ingress
      name: atmo-api
    fieldPaths:
    - spec.rules.0.host
    - spec.tls.0.hosts.0
- source:
    kind: ConfigMap
    name: ingress-env
    fieldPath: data.tlsSecret
  targets:
  - select:
      kind: Ingress
      name: atmo-api
    fieldPaths:
    - spec.tls.0.secretName
generatorOptions:
  disableNameSuffixHash: true
