apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - cronjobs/cronjob-ingestion-hourly.yaml
  - cronjobs/cronjob-ingestion-daily.yaml
  - cronjobs/cronjob-ingestion-weekly.yaml
patches:
  - path: patches/patch-deployment-metrics.yaml
    target:
      kind: Deployment
      name: atmo-api
  - path: patches/patch-deployment-imagepullsecret.yaml
    target:
      kind: Deployment
      name: atmo-api
  - path: patches/patch-deployment-rollout-readiness.yaml
    target:
      kind: Deployment
      name: atmo-api
