apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atmo-web-dev
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: atmo-web-dev-atmo-strip-prefix-dev@kubernetescrd
    traefik.ingress.kubernetes.io/router.priority: "10"
  labels:
    app.kubernetes.io/name: atmo-web
    app.kubernetes.io/component: dev-ingress
    app.kubernetes.io/part-of: atmo
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /dev/atmo
            pathType: Prefix
            backend:
              service:
                name: atmo-web
                port:
                  number: 80
