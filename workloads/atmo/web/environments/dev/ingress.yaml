apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: atmo-web-dev
  labels:
    app.kubernetes.io/name: atmo-web
    app.kubernetes.io/component: dev-ingress
    app.kubernetes.io/part-of: atmo
spec:
  routes:
    - match: "PathPrefix(`/dev/atmo`)"
      kind: Rule
      priority: 10
      middlewares:
        - name: atmo-strip-prefix-dev
      services:
        - name: atmo-web
          port: 80
