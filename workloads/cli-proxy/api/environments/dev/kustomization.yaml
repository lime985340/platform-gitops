apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cli-proxy-api-dev
labels:
  - pairs:
      app.kubernetes.io/instance: cli-proxy-api-dev
    includeSelectors: true
    includeTemplates: true
  - pairs:
      app.kubernetes.io/name: cli-proxy-api
    includeSelectors: false
    includeTemplates: true
resources:
  - ../../resources
  - peer-authentication.yaml
  - authorization-policy.yaml
