apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: neople-game-analytics-api-prod
  labels:
    app.kubernetes.io/name: neople-game-analytics-api
    app.kubernetes.io/component: prod-ingress
    app.kubernetes.io/part-of: neople-game-analytics
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: neople-game-analytics-api-prod-neople-api-strip-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /neople/api
            pathType: Prefix
            backend:
              service:
                name: neople-game-analytics-api
                port:
                  number: 80
