apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: neople-game-analytics-api-prod
labels:
  - pairs:
      app.kubernetes.io/instance: neople-game-analytics-api-prod
    includeSelectors: true
    includeTemplates: true
  - pairs:
      app.kubernetes.io/name: neople-game-analytics-api
    includeSelectors: false
    includeTemplates: true
resources:
  - ../../resources
  - sealed-secrets.yaml
patches:
  # The current test cluster has an unhealthy worker-to-worker Cilium path.
  # Keep the public API beside Traefik until that node-network issue is fixed.
  - target:
      kind: Deployment
      name: neople-game-analytics-api
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: cilium-gitops-test-worker2
images:
  - name: registry.gitlab.com/lime985340/neople-game-analytics-api
    newTag: v0.1.1
  - name: registry.gitlab.com/lime985340/neople-game-analytics-api/worker
    newTag: v0.1.1
