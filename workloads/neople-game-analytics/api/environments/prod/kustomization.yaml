apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: neople-game-analytics-api-prod
labels:
  - pairs:
      app.kubernetes.io/instance: neople-game-analytics-api-prod
    includeSelectors: true
    includeTemplates: true
  - pairs:
      app.kubernetes.io/name: neople-game-analytics-api
    includeSelectors: false
    includeTemplates: true
resources:
  - ../../resources
  - sealed-secrets.yaml
images:
  - name: registry.gitlab.com/lime985340/neople-game-analytics-api
    newTag: v0.1.0
  - name: registry.gitlab.com/lime985340/neople-game-analytics-api/worker
    newTag: v0.1.0
