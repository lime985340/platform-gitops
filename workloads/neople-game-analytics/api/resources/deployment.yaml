apiVersion: apps/v1
kind: Deployment
metadata:
  name: neople-game-analytics-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: neople-game-analytics-api
  template:
    metadata:
      annotations:
        secret.reloader.stakater.com/reload: "ghcr-regcred,neople-game-analytics-api-secret,neople-game-analytics-api-db-secret"
      labels:
        app: neople-game-analytics-api
        app.kubernetes.io/name: neople-game-analytics-api
        app.kubernetes.io/component: api
    spec:
      imagePullSecrets:
        - name: ghcr-regcred
        - name: gitlab-regcred
      containers:
        - name: api
          image: ghcr.io/lime985340/neople-game-analytics-api
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: neople-game-analytics-api-config
            - secretRef:
                name: neople-game-analytics-api-secret
                optional: false
            - secretRef:
                name: neople-game-analytics-api-db-secret
                optional: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: analytics-data
              mountPath: /app/data
      volumes:
        - name: analytics-data
          persistentVolumeClaim:
            claimName: neople-game-analytics-data
