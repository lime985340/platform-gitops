apiVersion: apps/v1
kind: Deployment
metadata:
  name: neople-game-analytics-web
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: neople-game-analytics-web
  template:
    metadata:
      labels:
        app: neople-game-analytics-web
        app.kubernetes.io/name: neople-game-analytics-web
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: registry.gitlab.com/lime985340/neople-game-analytics-web
          env:
            - name: API_UPSTREAM
              value: neople-game-analytics-api.neople-game-analytics-api-prod.svc.cluster.local
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
