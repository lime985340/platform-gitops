apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ontology-asal-agent-prod
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: ontology-asal-agent-api-prod-ontology-asal-agent-strip-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /ontology-asal-agent
            pathType: Prefix
            backend:
              service:
                name: ontology-asal-agent
                port:
                  number: 80
