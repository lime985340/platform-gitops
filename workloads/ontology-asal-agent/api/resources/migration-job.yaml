apiVersion: batch/v1
kind: Job
metadata:
  name: ontology-asal-agent-publish-ontology
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ontology-asal-agent
        app.kubernetes.io/component: ontology-migration
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: gitlab-regcred
      containers:
        - name: publish-ontology
          image: registry.gitlab.com/lime985340/ontology-asal-agent
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              if [ ! -s /run/secrets/graphdb-license/graphdb.license ]; then
                echo "GraphDB license is not configured; skipping ontology migration"
                exit 0
              fi
              until python -c "from urllib.request import urlopen; urlopen('http://graphdb.graphdb.svc.cluster.local:7200/protocol', timeout=5).close()"; do
                echo "waiting for GraphDB"
                sleep 5
              done
              python scripts/publish_ontology.py \
                --endpoint "$TRIPLESTORE_UPDATE_URL" \
                --graph "$TRIPLESTORE_ONTOLOGY_GRAPH" \
                --file ontology/domain.ttl \
                --replace
              python scripts/publish_ontology.py \
                --endpoint "$TRIPLESTORE_UPDATE_URL" \
                --graph "$TRIPLESTORE_SHAPES_GRAPH" \
                --file ontology/shapes.ttl \
                --replace
          envFrom:
            - configMapRef:
                name: ontology-asal-agent-config
          volumeMounts:
            - name: graphdb-license
              mountPath: /run/secrets/graphdb-license
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: graphdb-license
          secret:
            secretName: graphdb-license
            optional: true
