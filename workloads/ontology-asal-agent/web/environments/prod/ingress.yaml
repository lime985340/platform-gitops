apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ontology-asal-agent-web-prod
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: ontology-asal-agent-web-prod-ontology-asal-agent-web-strip-prefix@kubernetescrd
  labels:
    app.kubernetes.io/name: ontology-asal-agent
    app.kubernetes.io/component: web-ingress
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /ontology-asal-agent
            pathType: Prefix
            backend:
              service:
                name: ontology-asal-agent-web
                port:
                  number: 80
