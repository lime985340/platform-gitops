apiVersion: apps/v1
kind: Deployment
metadata:
  name: cli-proxy-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cli-proxy-api
  template:
    metadata:
      annotations:
        secret.reloader.stakater.com/reload: "cli-proxy-api-secrets"
      labels:
        app: cli-proxy-api
        app.kubernetes.io/name: cli-proxy-api
        app.kubernetes.io/component: llm-proxy
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: render-config
          image: alpine:3.20
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              test -n "${PROXY_API_KEY:-}" || {
                echo "PROXY_API_KEY is required" >&2
                exit 1
              }
              cat > /etc/cli-proxy-api/config.yaml <<EOF
              port: 8317
              auth-dir: /root/.cli-proxy-api
              api-keys:
                - ${PROXY_API_KEY}
              remote-management:
                allow-remote: false
              EOF
              chmod 0600 /etc/cli-proxy-api/config.yaml
          env:
            - name: PROXY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cli-proxy-api-secrets
                  key: PROXY_API_KEY
          volumeMounts:
            - name: config
              mountPath: /etc/cli-proxy-api
      containers:
        - name: cli-proxy-api
          image: eceasy/cli-proxy-api:v7.2.154
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/cli-proxy-api/config.yaml
          ports:
            - name: http
              containerPort: 8317
          volumeMounts:
            - name: config
              mountPath: /etc/cli-proxy-api
              readOnly: true
            - name: auth
              mountPath: /root/.cli-proxy-api
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          emptyDir: {}
        - name: auth
          persistentVolumeClaim:
            claimName: cli-proxy-api-auth
