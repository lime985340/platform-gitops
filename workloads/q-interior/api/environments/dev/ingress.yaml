apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: q-interior-api-dev
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: q-interior-api-dev-q-interior-strip-prefix@kubernetescrd
    traefik.ingress.kubernetes.io/router.priority: "100"
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /dev/saerom/api
            pathType: Prefix
            backend:
              service:
                name: q-interior-api
                port:
                  number: 80
