apiVersion: apps/v1
kind: Deployment
metadata:
  name: q-interior-api
spec:
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: q-interior-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: q-interior-api
        app.kubernetes.io/component: api
      annotations:
        secret.reloader.stakater.com/reload: "q-interior-db-secret,ghcr-regcred"
    spec:
      imagePullSecrets:
        - name: ghcr-regcred
      containers:
        - name: q-interior-api
          image: ghcr.io/lime985340/q-interior-api
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          env:
            - name: SPRING_CONFIG_IMPORT
              value: "configtree:/etc/secrets/"
            - name: JAVA_TOOL_OPTIONS
              value: "-Djava.net.preferIPv4Stack=true"
          volumeMounts:
            - name: app-secrets
              mountPath: /etc/secrets
              readOnly: true
      volumes:
        - name: app-secrets
          projected:
            sources:
              - secret:
                  name: q-interior-db-secret
                  items:
                    - key: SPRING_DATASOURCE_URL
                      path: spring/datasource/url
                    - key: SPRING_DATASOURCE_USERNAME
                      path: spring/datasource/username
                    - key: SPRING_DATASOURCE_PASSWORD
                      path: spring/datasource/password
