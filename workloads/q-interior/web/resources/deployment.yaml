apiVersion: apps/v1
kind: Deployment
metadata:
  name: q-interior-web
spec:
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: q-interior-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: q-interior-web
        app.kubernetes.io/component: web
      annotations:
        secret.reloader.stakater.com/reload: "gitlab-regcred"
    spec:
      imagePullSecrets:
        - name: gitlab-regcred
      containers:
        - name: q-interior-web
          image: registry.gitlab.com/lime985340/q-interior-client
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
